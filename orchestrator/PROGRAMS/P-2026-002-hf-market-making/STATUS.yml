    status: done
    notes: |
      ~300-line brief. ADOPT 3-term fair value: mid + micro-price adj
      (imbalance-only Markov chain on majors) + propagator flow term (Bouchaud;
      estimable from aggTrades ALONE → backtestable on full history now). TFI >
      quote-OFI on crypto perps (Silantyev XBTUSD). Forecast horizon ~2 avg
      mid-changes (seconds). REJECT DL-LOB (LOBCAST: SOTA collapses OOS) and
      30s bookDepth as quoting input. DEFER multi-level OFI etc until L2
      history accumulates.
  - id: r2-flow-fills
    phase: R
    name: R2 brief — Hawkes flow, fill probability, queue models, toxicity
    status: done
    notes: |
      368-line brief. Verdict: skip full Hawkes MLE — EWMA intensities (1s/30s
      half-lives) + imbalance-bucket multiplier capture the operational content.
      Sizes independent of intensity (separate histogram). Queue: bracket with
      hftbacktest RiskAverse vs ProbQueueModel (L2 can't pin position). KEY
      external evidence (arxiv 2502.18625, live Binance BTC-perp): ALL 1s maker
      markouts negative; naive symmetric quoting Sharpe -109. First deliverable
      = aggTrades markout harness (viability screen + toxicity labels).
  - id: r3-quoting
    phase: R
    name: R3 brief — GLFT, alpha-augmented quoting, funding-aware skew, RL verdict
    status: done
    notes: |
      ~330-line brief. ADOPT GLFT ergodic closed form (constant spread
      (2/γ)ln(1+γ/k)+S_glft, linear inventory skew; calibrate A,k from
      ln λ(δ)=ln A−kδ on aggTrade penetration rates; γ from target inventory
      band). Alpha enters as reservation-price shift: quote around
      microprice+α̂/κ_α, risk-capped per Bergault §5; spread/skew shape
      unchanged. Adverse selection preserves formula shape (params shift) —
      calibrate via post-fill markout ζ(δ), phase-2. Funding = running drift
      −q·f folded into skew (reject full funding-OU grid). Inventory cap by
      cascade jump-VaR + kill-switch. REJECT RL for now (simulator-internal
      results only).
