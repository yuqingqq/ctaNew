      markout pipeline, hftbacktest queue-model bracketing, Tokyo VPS.
      STRATEGIC: first deployment target = passive execution of the existing
      XS book (attacks the repo's binding constraint, no fee-tier wall);
      standalone-MM candidate = HL mid/tails pending forward HL spread data.

