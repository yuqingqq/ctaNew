      disc); rebates application-gated (~$100M/30d). HL base maker 1.5bps.
      Empirical spreads (Vision bookTicker 2024-03-15): BTC 0.026bp, ETH
      0.037bp (97% 1-tick), INJ 0.52bp, CHZ 0.88bp → VIP0 fee is 4-20x
      half-spread → standalone touch-MM on Binance liquid names REJECT at any
      solo tier; break-even needs ~4-5bp spreads at VIP3+. OPERATIONAL: Vision
