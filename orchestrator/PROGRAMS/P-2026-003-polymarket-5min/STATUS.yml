      all applied.
      THE ARC, because it is the useful part of the record: v1 used a LAGGING
      anchor. v2 fixed the lag with a TREND extrapolator and buried its
      conditional bias in the variance. v3 named the bias but kept two
      incompatible estimators of the same quantity. v4 chose one route in prose
