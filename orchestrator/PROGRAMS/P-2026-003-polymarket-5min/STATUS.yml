standing_rules:
  - CHECK THE DATA BEFORE USING IT, EVERY TIME — no lane is trusted by default.
    Before any analysis reads a lane, verify FOR THE EXACT ROWS IT WILL CONSUME
    coverage and the gap ledger per window, predictor staleness at each decision
    time, collector version / repair-era boundaries, and whether the lane is
    cleared for that class of inference (clob_capture_clean). Report the excluded
    set beside the retained one, and characterise it on the statistic the model
    actually estimates. Paid for four times — the FLB edge on p90 6.2s stale
    books; the v2 "repair successful" its own ledger contradicted 4 min later;
    the prices lane called "clean" on open_gaps=[] while logging 58 gaps in 11h;
    and the exclusion-MNAR reading that REVERSED SIGN once a variance statistic
    replaced a displacement one.
  - No design decision that a measurement on existing data could settle may be
    recorded as settled until that measurement is run.
  - Dedup prices by (timestamp, symbol) and raw by message identity — recv_ns
    differs per process, so exact-line dedup does NOT catch duplicate
    collectors. Check collectors with `ps -eo pid,etimes,cmd | grep
    live/pm_research` (pgrep patterns must include the pm_research/ segment).
  - Read book state from `price_change.best_bid/ask`, never from `book`
    snapshots — the latter are p90 6.2 s stale and quietly inflate any
    edge measured against them.
  - Read everything at knowledge time (recv_ns), never payload timestamps.
    Measured cost of getting this wrong is 0.5 pp on E-M6.

