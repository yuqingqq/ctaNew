    MEASUREMENT, NOT A PREFERENCE: A ROW IS NOT A FILL --
    harmful_exposure_rows.py:363-370 ALREADY SUMS EVERY TRANCHE INSIDE THAT ROW'S
    OWN ONE-SECOND HORIZON at or after the 50 ms cut, so multiple rows per action
    are OVERLAPPING DECISION-TIME SNAPSHOTS OF THE SAME EXPOSURE. Measured on the
    real feed: 1.797 rows/action, 26.9% of actions carry more than one row,
