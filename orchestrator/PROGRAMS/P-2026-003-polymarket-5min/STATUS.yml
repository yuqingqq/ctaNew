                             # gzip in flight, write backpressure (writer_wait=0,
                             # q_hi=1), memory (RSS 260MB stable), raw rate
                             # (dropped at 580 msg/s having sustained 984.7).
                             # Cause is NOT currently instrumented. Total
                             # disconnect rate ~unchanged (3.7/h -> 3.7/h); only
                             # the composition changed. Next step is a
