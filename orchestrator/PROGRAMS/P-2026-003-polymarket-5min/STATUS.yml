  OPPORTUNITY_MATCHING_SHARPENS_A_TEST_ONLY_IF_THE_RESTRICTED_SET_PAYS: >-
    RELAYED FROM R-518, AND IT IS THE TRANSFERABLE HALF -- record the reason, not
    just the withdrawal. OPPORTUNITY-MATCHING SHARPENS A TEST ONLY WHEN THE
    RESTRICTED POPULATION HAS POSITIVE EXPECTED VALUE. The intuition that
    restricting a null's pool to "the actions that could have mattered" makes it
    a harder bar is CORRECT ONLY UNDER THAT CONDITION, and it fails here: being
    in the preventable set is BAD ON AVERAGE (conditional_cancel_value
    -1.6364024437050162, CHECKED by me in round 90 and reproduced bit-exact from
    phase2_iter011.py:266), so A UNIFORM DRAW INSIDE THE PREVENTABLE SET IS A
    WORSE POLICY THAN A UNIFORM DRAW OVER EVERYTHING. 90.1% of everything is
    harmless zeros, AND ZERO BEATS -1.64. The restriction therefore LOWERS the
    bar it was meant to raise. This generalises past this programme: a
    "more relevant" comparison population is only a stronger control if
    membership in it is not itself a handicap.
  A_QUANTITY_WEARING_ANOTHER_NAME_recurs_reference_tranche_markout_cents: >-
    RELAYED FROM R-519. reference_tranche_markout_cents HOLDS THE ARM'S OWN
    MARKOUT -- a quantity wearing another quantity's name, WHICH IS THE SAME
    SHAPE AS control_realised_min/max (R-511(D)(i), where the emitted field held
    the signed-gap extremes and not the control's realisation). SECOND INSTANCE,
    SO IT IS A CLASS: a field name that describes a DIFFERENT quantity from the
    one it carries is not caught by any checker this programme has, because the
    value is in-codomain, the citation resolves and the arithmetic is right --
    only the NAME lies. It is what made the reconciliation get described wrongly:
    it is an EQUALITY EVERYWHERE, not "equality at the 0-cancel arm and
    directional elsewhere", BECAUSE BOTH SIDES ARE OVER THE ARM'S OWN FILLS. The
    coordinator relayed the wrong version to the USER and has corrected it.
  NEAR_IDENTITY_FROM_TWO_PRODUCERS_BEATS_BIT_IDENTITY_FROM_ONE: >-
    RELAYED FROM R-519, AND IT ANSWERS THE CORROBORATION QUESTION I RAISED ONE
    ROUND AGO WITH A CONCRETE INSTANCE. maker_pnl_cents == post_fill_markout_cents
    is NOT exact: the two differ by ~4e-12, and they come from TWO DIFFERENT
    PRODUCERS. THAT IS BETTER EVIDENCE THAN BIT-IDENTITY, because identical bits
    would be consistent with one value having been COPIED from the other, while a
    float-noise disagreement can only arise from two independent computations
    that agree. This is the corroboration axis in one line: what makes a number
    trustworthy is HOW MANY INDEPENDENT PRODUCERS STAND BEHIND IT, and the
    signature of independence is agreement TO TOLERANCE rather than to the bit.

