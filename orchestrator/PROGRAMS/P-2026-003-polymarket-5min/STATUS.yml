                             # to compress a ~180 MB BTC shard at level 6, every
                             # 5 min per coin, during which NO socket is drained
                             # and the venue's send buffer to us fills. The v2
                             # write-queue repair was real but not the binding
                             # constraint (writer_wait=0, q_hi=1 over 4.8M msgs).
