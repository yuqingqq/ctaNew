  CLASS_PHANTOM_FAILURE_named_2026_09_04: >-
    A NEW NAMED CLASS, AND IT BELONGS BESIDE THE ZERO-CONSUMER CLASS. PHANTOM
    FAILURE: A NEGATIVE VERDICT PRODUCED BY A PATH THAT DID NOT RUN -- THE MIRROR
    OF ABSENCE-READING-AS-A-PASS. The familiar trap lets a bad thing THROUGH;
    THIS ONE LETS NOTHING THROUGH AND INVENTS A BUG INSTEAD: a check that could
    not execute reports a DISAGREEMENT, a FAILURE, a MISSING window, and a reader
    spends an afternoon on it. Named by DA 2026-09-04 at
    da_arm_replay_verify.py:575, with a census at :977-1019 driven BOTH
    DIRECTIONS (PHANTOM-C1 ADMITS an `except` that returns a NAMED STATUS;
    PHANTOM-C2 FIRES on a bare False; C3 on an unchecked subprocess result; C4
    requires an unreadable tree to REFUSE). DA SWEPT ITS OWN INSTRUMENTS AND
    FOUND THREE MORE, all read at the source by MEM (:575-601): (i) battery()
    defaulted script_dir "." so the determinism children COULD NOT IMPORT and the
    check read identical false -- A DETERMINISM FAILURE WHEN NEITHER INTERPRETER
    RAN; (ii) a missing `sar` binary made the independent column reader return
    nothing and the check read as a COLUMN-BINDING FAILURE, i.e. "your production
    regex reads the wrong field"; (iii) THE ONE THAT IS A REAL CORRECTNESS BUG IN
    THE RACE MACHINERY -- pm_tape_density.uncompressed_size RETURNED 0 FOR A FILE
    IT COULD NOT READ, AND 0 MEANS DARK, so a permission or I/O error WOULD HAVE
    SURFACED AS A BLACKOUT THAT da_dark_interval_scan REPORTS AND
    da_blackout_mask MASKS. THE FIX, read by MEM at pm_tape_density.py:197-208:
    the value STAYS 0 so no caller changes shape, and the file is COUNTED IN A
    CENSUS scan_day SURFACES -- so the difference between "empty" and
    "unreadable" STOPS BEING INVISIBLE. A repair that ADDS A DISTINCTION rather
    than changing a return, which is the right shape when every consumer already
    reads the old one. AND THE CENSUS IS HONEST ABOUT ITS OWN LIMITS IN ITS OWN
    DOCSTRING: it is A TEXT SCAN that flags the two shapes it can see and CANNOT
    SEE A SEMANTIC ONE; IT REPORTS, AND A HIT IS A PLACE TO LOOK, NOT A DEFECT.
    It also applies its own discipline to itself -- it REFUSES when it cannot read
    the tree, "a census that cannot read the tree must not report a clean one".
  STANDING_RULE_no_number_reaches_the_user_before_review: >-
