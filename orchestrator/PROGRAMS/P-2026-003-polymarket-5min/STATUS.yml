    FAMILY RESEMBLANCE -- THE SAME SENTENCE THREE TIMES. THE OPERATIONAL FORM IS A
    QUESTION, NOT A PROGRAM: FOR EVERY TOKEN A READER WILL TAKE AS EVIDENCE, COULD
    THIS TOKEN HAVE BEEN PRODUCED WITH THE CLAIM FALSE? IF YES IT IS NOT EVIDENCE,
    WHATEVER IT IS MADE OF. BUT THE CHECKERS STAY THREE, BECAUSE THE ORACLE IS
    THREE AND NO SINGLE PROGRAM SPANS THEM: the CODOMAIN oracle is the function's
    OWN SOURCE, decidable statically (an AST pass, seconds); the CITATION oracle is
    ANOTHER ARTIFACT and nothing in the citing file can settle it (two documents,
    cheap); the PROSE oracle is A RUNNING SYSTEM, settled only by EXECUTION
    (arbitrarily expensive). Each has a case the other two are STRUCTURALLY BLIND
    to. A FOURTH ORACLE IS LIVE AND UNINSTRUMENTED -- CLAIMS ABOUT A POPULATION --
    and its standing instance is DE53's honest, rule-4-clean "1,309 of 31,122
    generations (4.21%) excluded": the claim a reader takes is that the arms'
    numbers DESCRIBE THE POPULATION, THE TOKEN READS IDENTICALLY WHETHER THE
    EXCLUSION IS IGNORABLE OR WILDLY SELECTIVE, and the oracle would be a
    STATISTICAL COMPARISON between the excluded and retained sets, which does not
    exist. A FIFTH IS NAMED RATHER THAN INSTRUMENTED -- CLAIMS ABOUT A HUMAN RULING
    -- where a citation check proves the ruling EXISTS and never that it MEANS what
    is claimed (the clob_v4/R-340 residue DA correctly declines to act on). IF ONE
    ARTIFACT IS EVER BUILT IT MUST BE A ROUTER, NOT A CHECKER: classify each
    claim-bearing token by which oracle settles it and REFUSE a token whose oracle
    is NONE, BECAUSE A CLAIM NO ORACLE CAN SETTLE IS PRECISELY THE ONE THAT GETS
    BELIEVED.
