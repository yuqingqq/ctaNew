  RULE_error_path_must_leave_the_codomain: >-
    THE MOST TRANSFERABLE THING THIS PROGRAMME HAS PRODUCED, ADOPTED AT R-505 (A)
    AS STANDING PRACTICE ALONGSIDE THE PUBLICATION PROVENANCE CENSUS: THE
    ERROR/ABSENCE PATH MUST NOT RETURN A VALUE INSIDE THE CODOMAIN OF THE
    MEASUREMENT. Once it does, A CONSUMER CANNOT SEPARATE "NOT MEASURED" FROM
    "MEASURED AND CAME OUT THIS WAY" -- and WHICH NAMED SHAPE APPEARS DEPENDS
    ONLY ON WHICH IN-DOMAIN VALUE YOU LAND ON: the SUCCESS value gives
    ABSENCE-AS-A-PASS, the FAILURE value gives PHANTOM FAILURE. THEY ARE ONE
    SHAPE SEEN FROM TWO CONSUMERS, AND THE FIX IS IDENTICAL IN BOTH DIRECTIONS --
    LEAVE THE CODOMAIN, BY RAISING OR BY A SENTINEL THE CONSUMER MUST BRANCH ON.
    That is why the many `return None` sites ARE CORRECT where the codomain is a
    bool, a sha or a registry dict, and why `return 0` FROM A BYTE COUNT IS NOT:
    0 is a legal byte count, so it lands inside the measurement and reads as
    DARK. MECHANICALLY CHECKABLE, degrading to a shape test for rich returns, and
    where an in-domain return is unavoidable IT FALLS BACK TO THE ZERO-CONSUMER
    CENSUS.
  RULE_codomain_BOUNDARY_does_not_cover_the_control_family: >-
