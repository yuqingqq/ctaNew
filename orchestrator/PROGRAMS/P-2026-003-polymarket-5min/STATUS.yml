standing_rules:
  - "STANDING RULE 10 (R-478 3, from the reviewer's 5c; DISTINCT from rule 9) --
    A SEAT'S SELFTEST RUNS IN THAT SEAT'S OWN WORKTREE. Where a check's
    condition can only be produced in another tree (THE SHARED MAIN TREE
    INCLUDED), the run is DECLARED IN THE ROW BEFORE IT IS MADE -- tree, HEAD,
    the condition, and why no other tree produces it -- performs NO WRITE
    outside its own git-admin entries, and is VERIFIED AFTERWARDS FROM A THIRD
    TREE by `git worktree list` + `git status --short`. A seat needing the
    shared tree looks FIRST for a commit that reproduces the condition in its
    own."
  - "PROGRAMME STANDARD (R-457 §2, from MEM's withdrawn count) — A SUITE RUN IN
    THE SHARED TREE MEASURES WHATEVER IS THERE AT SPAWN TIME. No seat reads,
    runs or counts another seat's module from the main tree while that seat's
    round is open: verify at the COMMITTED TIP in a detached worktree of your
    own, where a hash is a hash of the artifact. Hashing immediately before and
    after the run is necessary but NOT sufficient -- the WIP can be present at
    both hashes."
  - "PROGRAMME STANDARD (R-455 §5, MEM's form adopted) — EVERY GUARD ADDED TO
    CATCH A CLASS IS ITSELF A CANDIDATE FOR THAT CLASS. Two instances in
    consecutive rounds: CO-11, in the census guarding DE27-R1's one-text fix,
    and CO-12, in the mutation audit shipped to close BE5-R3. When a fix adds a
    control, mutate the control."
  - "PROGRAMME STANDARD (R-446, from the DE round-22 review) — a caught-and-named
    refusal inside a POSITIVE CONTROL is the right shape, provided the catch is
    NARROW (the module's own refusal type, never a bare Exception) and it FAILS
    rather than degrades: the sentinel is a conjunct of the assertion, not a
    printed note. A bare traceback is not louder, only less informative.
    Verified at de_ratification_check.py :1076, :1665 and :1752, each catching
    RatificationRefused only."
  - "PROGRAMME STANDARD (R-446) — every seat's mutant loop clears __pycache__
    BEFORE each execution, or runs under sys.dont_write_bytecode. A mutant and
    its restore that differ in no byte-count and share a whole-second mtime
    leave the OLD bytecode executing; the DANGEROUS direction is the stale
    RESTORE, a falsifier credited without ever having fired. A pre-run clear
    closes both directions, a post-run clear only one."
  - CHECK THE DATA BEFORE USING IT, EVERY TIME — no lane is trusted by default.
    Before any analysis reads a lane, verify FOR THE EXACT ROWS IT WILL CONSUME
    coverage and the gap ledger per window, predictor staleness at each decision
    time, collector version / repair-era boundaries, and whether the lane is
    cleared for that class of inference (clob_capture_clean). Report the excluded
    set beside the retained one, and characterise it on the statistic the model
    actually estimates. Paid for four times — the FLB edge on p90 6.2s stale
    books; the v2 "repair successful" its own ledger contradicted 4 min later;
    the prices lane called "clean" on open_gaps=[] while logging 58 gaps in 11h;
    and the exclusion-MNAR reading that REVERSED SIGN once a variance statistic
    replaced a displacement one.
  - No design decision that a measurement on existing data could settle may be
    recorded as settled until that measurement is run.
  - Dedup prices by (timestamp, symbol) and raw by message identity — recv_ns
    differs per process, so exact-line dedup does NOT catch duplicate
    collectors. Check collectors with `ps -eo pid,etimes,cmd | grep
    live/pm_research` (pgrep patterns must include the pm_research/ segment).
  - Read book state from `price_change.best_bid/ask`, never from `book`
    snapshots — the latter are p90 6.2 s stale and quietly inflate any
    edge measured against them.
  - Read everything at knowledge time (recv_ns), never payload timestamps.
    Measured cost of getting this wrong is 0.5 pp on E-M6.

