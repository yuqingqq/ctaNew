    ARITHMETIC MYSELF: arrival_n is 177,674 at the artifact, so the budgets are
    8,883 / 17,767 / 26,651 at 5/10/15% against a preventable pool of 17,604 --
    163 SHORT AT 10% AND 9,047 SHORT AT 15%, with the preventable share
    0.09908033814739355. (ii) Where it cannot supply the budget the draw becomes
    a POINT MASS and p = 1/(n+1) BY CONSTRUCTION -- a floor manufactured by the
    design, not measured. (iii) At 5% it is 2.4-3.8x EASIER to beat, because the
    preventable population's mean is NEGATIVE. (iv) AND THE ONE NOBODY SAW: it
    would have pushed the HOLM DENOMINATOR FROM 24 TO 30 AND RETROSPECTIVELY
    KILLED Q1 AND Q3 -- this artifact's ONLY surviving results. WHAT REPLACES IT:
