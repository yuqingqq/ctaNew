      level of abstraction higher, and each was caught by an adversarial probe
      rather than by a test I had written.
      ITER4 APPLIED: M4-1 route A is no longer gated on route B's sampling
      convention (that gate had removed the very advantage that selected route A);
      its precondition is StreamProvenance. M4-2 ONE ATOMIC QUERY —
