  ONE_DEFECT_FOUR_ORACLES_the_counterfactual_test: >-
    R-509 (A)-(C), AND IT SUBSUMES
    COMMON_SOURCE_PROPAGATION_a_citation_check_is_not_a_claim_check RATHER THAN
    REPLACING IT. THE DEFECT IS ONE AND IT IS COUNTERFACTUAL: take a claim C and a
