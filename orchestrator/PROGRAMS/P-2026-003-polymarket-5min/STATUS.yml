standing_rules:
  - "STANDING RULE 15 (USER ruling, R-529(A)) -- EVERY STATEMENT OF A FORWARD-RACE
    RESULT SAYS UP FRONT THAT IT ESTABLISHES DIRECTION AND CONSISTENCY, AND NEVER
    A HOLM-CLEARING VERDICT. G=5 stands and the recorded multiplicity of 2 stands
    and is NOT made decorative. The reason is arithmetic and was verified: THE
    CEILING OF A CLUSTERED PERMUTATION TEST IS ITS FLOOR, 1/2^G -- at G=5 that is
    0.03125, so the best possible adjusted p at m=2 is 0.0625, ABOVE 0.05. The
    bar was EXACTLY ONE DAY SHORT of what its own recorded multiplicity requires,
    and the USER chose honesty about what five days of one-hour-scale data can
    support over extending the clock. A caveat placed after the number is not
    this rule; it goes FIRST."
  - "STANDING RULE 14 (MEM, from checking R-523's provenance claim; the twin of
    rule 12) -- A CLAIM ABOUT A MOVING REFERENCE CARRIES THE REVISION IT WAS TRUE
    AT, OR IT IS NOT A CLAIM. Rule 12 covers negative existence; this covers any
    claim measured against something that moves -- `the tip`, `HEAD`,
    `origin/<branch>`, a line number, `the latest artifact`. The instance:
    R-523's *3 of 7 differ at the named commit while all 7 match at the tip* was
    TRUE at `9f25483` and was ALREADY STALE at `b22fb30` minutes later, because
    DE59 touched exactly those three files. MEM reproduced the error while
    checking it -- comparing against `origin/mm-research`, which moved under it,
    and briefly reading a contradiction that was not there. It is the same
    failure as the round-89 line citations that moved mid-write: A CITATION
    WITHOUT A PINNED REF IS NOT A CITATION, whether the moving thing is a line
    number or a branch head."
  - "STANDING RULE 12 (R-517, the coordinator's rule about its own claims) --
    A NEGATIVE EXISTENCE CLAIM CARRIES AN AS-OF OR IT IS NOT A CLAIM. Three
    instances in one day, wrong three DIFFERENT ways: `no arms artifact exists
    anywhere` said while they sat under `/tmp` and the search covered
    `/home/yuqing`; said again while one landed AFTER the look; and said a third
    time where GITIGNORED was read as ABSENT. The failure is not carelessness,
    it is that `nothing matched` is a statement about a SEARCH -- its root, its
    filters and its instant -- and it is written down as a statement about the
    WORLD. So a negative existence claim names WHERE it looked, WHAT it
    excluded, and WHEN, or it is not admissible.
    AMENDMENT 2026-09-04T14:03Z (MEM, from R-529(C); RULE 12 IS THE
    COORDINATOR'S AND THIS AMENDMENT IS FLAGGED TO THEM RATHER THAN ASSUMED) --
    THE CLAIM'S SCOPE MAY NOT EXCEED THE SURFACE ACTUALLY ENUMERATED. R-528
    searched a real surface with a real vocabulary and a real shape test, and
    then stated its conclusion over BOTH PROGRAMMES when only one had been
    enumerated: live/pm_research/ was never walked, and DA found two
    counterexamples inside it with a third method. So the as-of, the root and
    the filters are NECESSARY AND NOT SUFFICIENT -- the sentence must not
    generalise past them. A METHOD CAN BE SOUND AND THE SENTENCE STILL FALSE,
    because the defect was THE SURFACE, not the search."
  - "STANDING RULE 13 (R-517, USER-facing practice, coordinator ruling) --
    A RESULT-BEARING ARTIFACT THAT A RECEIPT OR REGISTER ENTRY CITES IS
    COMMITTED, with `git add -f` where needed, BESIDE ITS PRODUCING CODE IN THE
    SAME COMMIT. Individual artifacts under about 1 MB; receipts and censuses
    YES; bulk tape and caches NEVER. The rule exists because three arms
    artifacts vanished on 2026-09-04 and a fourth was deleted while under
    review, so a filing's evidence outlived the filing by nothing at all. It is
    also what makes `mem_flag_provenance.py`'s missing-artifact FINDING
    meaningful rather than noise: a CHECKED flag whose artifact is gone is now
    a repository defect, not an expected condition."
  - "STANDING RULE 11 (R-515(C), the coordinator's own correction; MEM records
    it, MEM does not own it) -- A VERIFICATION YOU PERFORMED YOURSELF IS
    EVIDENCE; A SEAT'S REPORT IS A CLAIM; AND WHEN THEY CONFLICT THE CONFLICT IS
    ADJUDICATED AT THE ARTIFACT, NEVER BY DEFERRING TO THE SEAT. The instance:
    the coordinator read `increment_beats_incumbent` correctly as False at the
    artifact, then accepted BE's contrary report and wrote None into R-513(A),
    discarding a verification already performed. This is a NEW shape -- every
    other failure today was relaying an UNCHECKED claim; this is discarding a
    CHECKED one. It is the counterpart to `mem_flag_provenance.py`: the
    instrument asks whether a claim was ever checked, and this rule governs what
    happens when a check EXISTS and a report disagrees with it. Deference is not
    humility when it overwrites a measurement."
  - "STANDING RULE 10 (R-478 3, from the reviewer's 5c; DISTINCT from rule 9) --
    A SEAT'S SELFTEST RUNS IN THAT SEAT'S OWN WORKTREE. Where a check's
    condition can only be produced in another tree (THE SHARED MAIN TREE
    INCLUDED), the run is DECLARED IN THE ROW BEFORE IT IS MADE -- tree, HEAD,
    the condition, and why no other tree produces it -- performs NO WRITE
    outside its own git-admin entries, and is VERIFIED AFTERWARDS FROM A THIRD
    TREE by `git worktree list` + `git status --short`. A seat needing the
    shared tree looks FIRST for a commit that reproduces the condition in its
    own."
  - "PROGRAMME STANDARD (R-457 §2, from MEM's withdrawn count) — A SUITE RUN IN
    THE SHARED TREE MEASURES WHATEVER IS THERE AT SPAWN TIME. No seat reads,
    runs or counts another seat's module from the main tree while that seat's
    round is open: verify at the COMMITTED TIP in a detached worktree of your
    own, where a hash is a hash of the artifact. Hashing immediately before and
    after the run is necessary but NOT sufficient -- the WIP can be present at
    both hashes."
  - "PROGRAMME STANDARD (R-455 §5, MEM's form adopted) — EVERY GUARD ADDED TO
    CATCH A CLASS IS ITSELF A CANDIDATE FOR THAT CLASS. Two instances in
    consecutive rounds: CO-11, in the census guarding DE27-R1's one-text fix,
    and CO-12, in the mutation audit shipped to close BE5-R3. When a fix adds a
    control, mutate the control."
  - "PROGRAMME STANDARD (R-446, from the DE round-22 review) — a caught-and-named
    refusal inside a POSITIVE CONTROL is the right shape, provided the catch is
    NARROW (the module's own refusal type, never a bare Exception) and it FAILS
    rather than degrades: the sentinel is a conjunct of the assertion, not a
    printed note. A bare traceback is not louder, only less informative.
    Verified at de_ratification_check.py :1076, :1665 and :1752, each catching
    RatificationRefused only."
  - "PROGRAMME STANDARD (R-446) — every seat's mutant loop clears __pycache__
    BEFORE each execution, or runs under sys.dont_write_bytecode. A mutant and
    its restore that differ in no byte-count and share a whole-second mtime
    leave the OLD bytecode executing; the DANGEROUS direction is the stale
    RESTORE, a falsifier credited without ever having fired. A pre-run clear
    closes both directions, a post-run clear only one."
  - CHECK THE DATA BEFORE USING IT, EVERY TIME — no lane is trusted by default.
    Before any analysis reads a lane, verify FOR THE EXACT ROWS IT WILL CONSUME
    coverage and the gap ledger per window, predictor staleness at each decision
    time, collector version / repair-era boundaries, and whether the lane is
    cleared for that class of inference (clob_capture_clean). Report the excluded
    set beside the retained one, and characterise it on the statistic the model
    actually estimates. Paid for four times — the FLB edge on p90 6.2s stale
    books; the v2 "repair successful" its own ledger contradicted 4 min later;
    the prices lane called "clean" on open_gaps=[] while logging 58 gaps in 11h;
    and the exclusion-MNAR reading that REVERSED SIGN once a variance statistic
    replaced a displacement one.
  - No design decision that a measurement on existing data could settle may be
    recorded as settled until that measurement is run.
  - Dedup prices by (timestamp, symbol) and raw by message identity — recv_ns
    differs per process, so exact-line dedup does NOT catch duplicate
    collectors. Check collectors with `ps -eo pid,etimes,cmd | grep
    live/pm_research` (pgrep patterns must include the pm_research/ segment).
  - Read book state from `price_change.best_bid/ask`, never from `book`
    snapshots — the latter are p90 6.2 s stale and quietly inflate any
    edge measured against them.
  - Read everything at knowledge time (recv_ns), never payload timestamps.
    Measured cost of getting this wrong is 0.5 pp on E-M6.

