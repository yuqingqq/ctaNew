focus: >
  Build and test the model, mechanism-first, no PnL/capacity estimation
  (user, 2026-08-20). Entry point is live/pm_research/PM_ARCHITECTURE.md (v12)
  with contracts/contracts.yaml as the machine-readable source of truth.
  IMMEDIATE: keep the chosen REDUCED_FORM pricing route, but close its boundary
  before fitting it. Remove Route-B convention verification from Route A; make
  request, law header and observables one atomic pricing-distribution query;
  fail closed on all temporal, numeric and per-horizon statistical evidence;
  and make Route B a non-pricing diagnostic type with bias outside conditional
  variance. Then repair the route union, schedule and coefficient units, c(r)
  contract, and dynamics-consumer mapping. Phase 0A step 5 may study Route B in
  parallel but must not gate a valid Route-A fit. Estimator implementation HOLD.

standing_rules:
  - No design decision that a measurement on existing data could settle may be
    recorded as settled until that measurement is run.
  - Dedup prices by (timestamp, symbol) and raw by message identity — recv_ns
    differs per process, so exact-line dedup does NOT catch duplicate
    collectors. Check collectors with `ps -eo pid,etimes,cmd | grep
    live/pm_research` (pgrep patterns must include the pm_research/ segment).
  - Read book state from `price_change.best_bid/ask`, never from `book`
    snapshots — the latter are p90 6.2 s stale and quietly inflate any
    edge measured against them.
  - Read everything at knowledge time (recv_ns), never payload timestamps.
    Measured cost of getting this wrong is 0.5 pp on E-M6.

