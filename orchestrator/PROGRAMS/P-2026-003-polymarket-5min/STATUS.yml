      all 84 GateEvidence verdicts are INSUFFICIENT_EVIDENCE. Descriptively,
      42/42 mean effects and 40/42 variance effects exceed their tolerances:
      preserve this as an early warning, not a statistically valid refutation.
      Phase 0A 5 (S30/S60 semantics) gates route B only and may run in parallel.
      ITER5 VERDICT: MEASUREMENT GO / PRICING HOLD. No Revision 6 before data.
