                             # changing DISK_WORKERS or ping_timeout now would
                             # add a fourth era boundary with the cause still
                             # unknown, which is how the v2 addendum went wrong.
                             # PRIOR (still true as far as it goes): The v2 addendum's "repair
                             # successful" is WITHDRAWN: the collector's own
                             # ledger logged SLOW_CONSUMER_1013 on BTC 5.8 min
                             # after the clob_v2_1 deploy, and v2_1 finished its
                             # 80-min run at retries=5 slow=5 (all BTC) over
                             # 4.82M messages = one drop per ~16 min.
