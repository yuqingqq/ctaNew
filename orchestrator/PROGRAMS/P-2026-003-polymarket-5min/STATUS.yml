  - id: sigma-model
    phase: 1
    name: Volatility estimator — Route A measured descriptively
    status: measured-descriptive-pricing-hold
    notes: |
      Lineage: plan 80f823e -> review 6bea435 -> Rev 2 cc1d0e7 -> review 20b759e
      -> Rev 3 7474e49 -> review 11e3c09 -> Rev 4 be23ec1 -> review ef6d1df ->
      Rev 5 (this). Four review rounds, every one of which found a real defect;
      all applied.
      THE ARC, because it is the useful part of the record: v1 used a LAGGING
      anchor. v2 fixed the lag with a TREND extrapolator and buried its
      conditional bias in the variance. v3 named the bias but kept two
      incompatible estimators of the same quantity. v4 chose one route in prose
      and contradicted the choice in code. Each error was the previous error one
      level of abstraction higher, and each was caught by an adversarial probe
      rather than by a test I had written.
      ITER4 APPLIED: M4-1 route A is no longer gated on route B's sampling
      convention (that gate had removed the very advantage that selected route A);
      its precondition is StreamProvenance. M4-2 ONE ATOMIC QUERY —
      pricing_distribution(law, request, observables) validates every temporal and
      identity invariant BEFORE either moment and returns both from one validated
      fit; v15's separate accessors called no checker, and its helper accepted a
      future-issued law and a REVERSED target interval. M4-3 numeric fail-closed:
      v15 priced resid_var=-1 and passed NaN counts and NaN p-values because every
      ordered comparison against NaN is false; infinity raised OverflowError.
      M4-4 failure to reject is NOT equivalence — GateEvidence carries a verdict
      (PASS / INSUFFICIENT_EVIDENCE / MODEL_REFUTED), an effect size and a
      tolerance bound, and PASS requires the CI bound inside the tolerance.
      M4-5 cond_var_at_model takes NO alpha, so an empirical alpha can no longer
      change the alleged conditional variance, and route B returns a DISTINCT
      TYPE with no pricing protocol. M4-6 PathLaw is a real discriminated union;
      WeightAtOffset, KernelCoefficient (SECONDS) and c(r)-as-ratio land in v16.
      ALSO: section 1a now maps every consumer to its actual source. "Diagnostic"
      means NOT A PROBABILITY INPUT, not "not operational" — the four shape
      consumers read ROUTE A's own horizon profile, so route B feeds no control.
      PHASE 0A 6 EXECUTED under preregistered route_a_v1. The immutable snapshot
      produced 9,332 admissible rows, 5,796 OOS rows and all 42 expected fits.
      Settlement direction agreed 1560/1560; independent timing/formula/fold/
