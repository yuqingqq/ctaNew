  - id: sigma-model
    phase: 1
    name: Volatility estimator — ITER2 applied (Rev 3 / v14), anchor to ESTIMATE
    status: iter2-applied-hold
    notes: |
      Three estimators were built and each violated a decision already made
      (static pooled -> static per-coin -> rolling per-window with POOLED blend
      weights). Root cause was not sigma: the ANCHOR was wrong, TWICE.
      Lineage: SIGMA_PLAN.md 80f823e -> review 6bea435 -> Revision 2 cc1d0e7 ->
      SIGMA_PLAN_REVIEW_ITER2.md -> Revision 3 (this).
      THE V2 ERROR WAS THE V1 ERROR ONE LEVEL DEEPER. v1 used a LAGGING anchor
      (trailing S60). v2 fixed the lag with P_hat = 2*S30-S60, justified by a
      LOCALLY LINEAR PATH — a trend model — then entered that estimator's
      UNCONDITIONAL MSE as a zero-mean variance line. Under the driftless model
      used everywhere else, trajectories have no local derivative and 2/-1 is
      not the conditional mean: the error is (alpha-alpha*)*(S30-S60) + a
      zero-mean residual, with alpha* = 2700/1801 = 1.4991671. The first term is
      OBSERVABLE AT DECISION TIME, so v2 buried a predictable mean error in the
      variance — sd 1.22 bps against sigma_eff(30) ~2.4 bps, i.e. HALF the sd at
      r=30. Same defect class as the bug that started the thread.
      Also: the conditional variance is ALPHA-INDEPENDENT (8.2590, not 9.5139 —
      the gap was squared bias), and v2's "floor" of 9.5139 is BEATEN by alpha*
      inside v2's own model, so it was never a bound.
      APPLIED: M2-1 anchor rebuilt as a conditional-MEAN problem (AnchorSpec,
      bias_enters ∈ {MEAN_MODEL, REFUSED}); M2-2 SamplingConvention versioned and
      UNVERIFIED, kernel step REOPENED; M2-3 non-ordered AnchorErrorEvidence +
      2x2 FeedErrorCov; M2-4 one ledger, no hidden nugget, exact domain refusal,
      exact-rational tests (24 checks); M2-5 contracts v14, all eight sub-items;
      M2-6 plan REWRITTEN IN PLACE as Revision 3 (1024 -> 649 lines), not a third
      overlay, contradiction scan clean.
      SELF-CHECK WORTH KEEPING: v2's Monte-Carlo independence test drew the
      future innovation independently BY CONSTRUCTION — a test that could not
      fail. That is the FOURTH artefact in this programme to report success
      without checking the thing it existed to check (v8 contract checker,
      path-keyed allowlist, that MC, and v13 itself). Assume the next one exists.
      NEXT (neither is code): Phase 0A 5 — VERIFY S30/S60 semantics against the
      1 s Binance tape, which gates kernel and anchor together; Phase 0A 6 —
      ESTIMATE alpha on the tape, preferably by regressing observed x_T on
      observed (S30, S60), which needs neither latent spot nor the internal
      kernel and is robust to 5's outcome.
