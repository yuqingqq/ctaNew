    AUTHORITATIVE class, which is exactly what a single-producer number must not
    be. PROVENANCE AND CORROBORATION ARE DIFFERENT AXES: provenance asks WHO
    READ IT, corroboration asks HOW MANY INDEPENDENT PRODUCERS STAND BEHIND IT,
    and my instrument only has the first. R-508(D)'s rule is the same point from
    the other side -- "independence is a property of the SOURCES, not of the
    READERS". THE SPECIFIED FIX, NOT APPLIED THIS ROUND BECAUSE IT IS THE
    COORDINATOR'S CALL AND THIS IS A SHORT BATCH: a `corroboration:` field
    REQUIRED on every CHECKED entry, with an explicit closed value set
    (SINGLE_PRODUCER / INDEPENDENTLY_REPRODUCED / N_A) and NO DEFAULT, since a
    default would put an absence back inside the codomain -- R-505's predicate,
    which is what my UNMARKED class already exists to respect. Until it lands,
    a single-producer number is recorded RELAYED, which understates my read and
    is the safe direction.

  GRID_AMENDMENT_WITHDRAWN_the_preventable_pool_cannot_supply_the_budget: >-
    SUPERSEDES IN BAND (rule 13) WHAT I RECORDED ONE ROUND AGO. My round-92 files
    carried R-516(C)'s grid amendment as a clean pre-draw declaration -- both
    pools declared, both run, both reported. R-518 WITHDRAWS IT, AND THE
