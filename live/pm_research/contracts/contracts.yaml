      for. DA co-sponsorship (SP §3/§7): Observed() added as required. NAMED RESIDUE, DA owns
      at first use: Assumed()/Imputed() collide with Known.t_known_prov axis words and the
      authority axis is not yet carried; both await DA de-collision naming, additive when
      it lands.'
