  # --- v25 (R-397, USER ruling 2026-09-02): DE registry amendment A-D applied; E HELD behind BE confirmation (proposal section 2.3) ---
  ReplayFill:
    fields:
      t: Timestamp
      maker_side: str
      level: float
      size: float
      mid_at_fill: float
      aggressor_micro: bool
    notes: one maker fill as the environment emits it (ev_replay.py:82-98); RAW,
      carrying no markout and no evaluation field
  UnavailableInterval:
    fields:
      t0: Timestamp
      t1: Timestamp
    notes: a collector-gap interval during which state was killed and resting
      quotes retracted; first-class in RunRecord because an absence must be a
      status, never a silent omission
  ReplayWindowSpec:
    fields:
      slug: str
      inputs_hash: Hash
    notes: 'the environment takes an EXPLICIT window list and stamps it, never
      chooses (EV_REPLAY_PLAN section 2: selection is an R-ADMISS decision the
      coordinator ratifies). inputs_hash covers the gap list and token ids, which
      shape records and previously moved run_hash unattributably.'
  RunRecord:
    fields:
      slug: str
      coin: str
      arm: str
      queue_bound: enum:FRONT|BACK_DISPLAYED
      fills: list[ReplayFill]
      mid_t: list[Timestamp]
      mid_v: list[float]
      unavailable_iv: list[UnavailableInterval]
      diagnostics: dict[str, int]
      record_hash: Hash
    notes: 'RAW events of one window replay, carrying NO evaluation field by
      design (EV_REPLAY_PLAN section 0 rule 1: markout, calibration, gate
      verdicts and attribution are computed after a run returns, never inside
      the loop and never visible to the solver). record_hash covers the FULL
      record including the mid path and interval endpoints the receipt body does
      not serialize.'
  ReplayReceipt:
    fields:
      protocol: str
      status: str
      engine_hash: Hash
      state_lag_s: Duration
      quote_size_shares: float
      seed: int
      collector_era: str
      sp_parameter_set: dict[str, any]
      windows: list[ReplayWindowSpec]
      records: list[RunRecord]
      gates: dict[str, any]
      provenance: Provenance
      run_hash: Hash
    notes: 'the stamped identity of one replay run. Gate outcomes live IN the
      receipt, not in stdout, so a PASS cell is checkable at the artifact rather
      than by entailment from fail-loud ordering. status is
      RESEARCH_ONLY_NOT_DECISION_ELIGIBLE in v1 and no field here is
      decision-eligible: models estimate, policy decides.'
  GenerationTrancheTable:
    fields:
      unit: enum:GENERATION
      latency_ms: int
      estimand_horizon_s: Duration
      estimand_note: str
      markout_s: Duration
      n_generations: int
      n_rows_consumed: int
      rows_per_generation: float
      generations: dict[str, GenerationTranche]
    notes: 'the Phase-4 feed (R-165(2) item 5): generation-level tranche tables,
      NOT per-row latency labels, because a generation is the cancellable unit
      and several rows share one outcome (measured 1.99 rows/fill, max 23).
      estimand_horizon_s is REQUIRED and carried, so a downstream cell cannot
      lose the 1 s cap it inherited; the emitter refuses to produce this record
      without an explicit declaration of the cap.'
  GenerationTranche:
    fields:
      n_rows: int
      preventable_value_cents: float
      preventable_shares: float
      stale_shares: float
      t_start_min: Timestamp
      t_start_max: Timestamp
      coin: str
      day: Date
    notes: one cancellable generation's value AT ITS FIRST CROSSING, never the
      sum over its rows; summing would count one outcome once per row
modules:
  DA-FlowNormalize:
    consumes:
    - RawEvent
    - StateView
    - AdmissibilityDecision
    produces:
    - FlowArrival
    - HealthEvent
    ports:
    - read_all
    - telemetry_out
    notes: offline research normalizer; joins arrivals and exposure to one frozen knowledge-admissible
      state and exposes no venue port
  BE-FlowFit:
    consumes:
    - FlowArrival
    - DatasetPartition
    produces:
    - ArrivalIntensityFit
    - ConditionalMarkLaw
    - NotionalThroughput
    - TimeChangeDiagnostic
    - HawkesResidualFit
    - HawkesDevelopmentDiagnostic
    - HealthEvent
    ports:
    - read_all
    - artifact_resolver
    - telemetry_out
    notes: offline per-coin research fit under R-FLOW; HawkesResidualFit is forward-gated
      while HawkesDevelopmentDiagnostic is never decision-eligible; the module exposes no
      venue or action port
  DA-FlowActionGrid:
    consumes:
    - DatasetPartition
    - StateView
    produces:
    - FlowAction
    - QueuePositionBound
    - AdverseFeatureRow
    - HealthEvent
    ports:
    - read_all
    - telemetry_out
    notes: offline immutable shadow-action and knowledge-time adverse-feature materializer;
      uses public book state, retains unavailable rows, and has no venue or order port
  BE-FillFit:
    consumes:
    - FlowArrival
    - FlowAction
    - QueuePositionBound
    - ArrivalIntensityFit
    - ConditionalMarkLaw
    - DatasetPartition
    - AdverseFeatureRow
    produces:
    - FillQuantityBound
    - FlowActionFillFit
    - AdverseMoveFit
    - HealthEvent
    ports:
    - read_all
    - artifact_resolver
    - telemetry_out
    notes: offline action-reach, queue-bound and action-conditioned adverse-move fit under
      R-FILL/R-ADVERSE; no venue or order port
  EV-FlowDevelopment:
    consumes:
    - ArrivalIntensityFit
    - ConditionalMarkLaw
    - HawkesDevelopmentDiagnostic
    - FlowActionFillFit
    - FillQuantityBound
    produces:
    - FlowDevelopmentRun
    ports:
    - read_all
    - artifact_resolver
    notes: emits a DEVELOPMENT receipt for within-design diagnostics only and is read by no
      decision module
  BE-FlowAndFills:
    consumes:
    - ActionSet
    - StateView
    - SelfState
    - ArrivalIntensityFit
    - ConditionalMarkLaw
    - FlowActionFillFit
    - AdverseMoveFit
    produces: Uncertain[ActionOutcome] | Unavailable
    ports:
    - state_view
    - rng
    - artifact_resolver
    - telemetry_out
    notes: decision-facing seam only; remains unavailable until fill and adverse-move artifacts
      are forward-valid, emits toxicity only inside complete ActionOutcome economics, and contains
      no venue adapter
  EV-AdverseMove:
    consumes:
    - AdverseMoveFit
    - FlowActionFillFit
    - DatasetPartition
    produces:
    - AdverseMoveEvaluation
    - GateEvidence
    - HealthEvent
    ports:
    - read_all
    - artifact_resolver
    notes: offline forward validator under R-ADVERSE; scores calibration and frozen-policy
      KEEP-versus-CANCEL value and has no decision or venue port
  BE-Uncertainty:
    consumes:
    - ForecastRequest
    produces:
    - dict[InstrumentId, Known[Uncertain[PathLaw]] | Unavailable]
    - GateEvidence
    ports:
    - state_view
    - artifact_resolver
    - telemetry_out
    notes: 'M14-1. Fits the physical-volatility law from the TAPE; outcomes are used only
      for calibration and falsification, never to fit it. Emits a law, not a scalar. Instrument-scoped
      and per-symbol: the measured level spans 4.6x across coins, so a pooled sigma is a 4.6x
      error, and any pooling appears as a declared shrinkage weight, never as a parameter
      tie. Reads ONLY through the state_view port (R-PORT/R-KNOW) -- v13 declared `consumes:
      RawEvent`, which reached past the DA/StateView knowledge-time seam into the landing
      zone and would have let un-truncated data into a walk-forward fit. Refuses (Unavailable)
      rather than extrapolating outside horizon_domain, when sampling_convention.status is
      UNVERIFIED, or when its own inputs are unavailable -- in particular the belief fallback
      may NOT inherit a book-sourced d after the book has failed.'
  BE-Competition:
    produces: dict[InstrumentId, Known[Uncertain[CompetitionState]] | Unavailable]
    notes: instrument-scoped marginals
  BE-CompetitionAggregator:
    consumes:
    - BE-Competition
    - CouplingGraph
    produces: Known[Uncertain[JointCompetitionState]] | Unavailable
    requires:
      dependence: Dependence
    notes: combines marginals under an EXPLICIT dependence contract; refuses if unknown
  BE-ScenarioProvider:
    produces: Known[JointOutcomeDistribution] | Unavailable
  DA-Normalize:
    consumes:
    - RawEvent
    - SourceProfile
    - ImputationRule
    produces:
    - Known
    - DatasetPartition
    - HealthEvent
    ports:
    - feed
    - telemetry_out
  DA-Coverage:
    consumes:
    - DatasetPartition
    - AdmissibilityRule
    produces:
    - Coverage
    - AdmissibilityDecision
    - DatasetPartition
    - HealthEvent
    ports:
    - read_all
    - telemetry_out
  DA-State:
