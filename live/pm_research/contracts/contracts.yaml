version: 25
rules:
  R-SSOT:
    body: every canonical name has exactly one owning type/module
    checks:
    - 'loss_limit_owner: ScenarioLossLimit only in SP-Params'
  R-KNOW:
    body: no production API accepts event time; derived t_known = MAX(inputs); EventTimeView
      is reachable only through the R-CANARY harness
  R-ONCE:
    body: MarkoutPartition, WealthLedger, VarianceGroup are disjoint registries
  R-PROV:
    body: assumed-provenance params may not gate a decision
  R-VERSION:
    body: 'specs bitemporal: observed_at + validity interval'
  R-NULL:
    body: nulls are field-level NullPin with a bias direction
  R-PORT:
    body: only the composition root sees Environment; modules take declared ports
  R-COMPAT:
    body: n-ary validation over (utility, solver, coupling)
  R-ENV:
    body: no module reads a wall clock
  R-OPEN:
    body: utility/solver/incentive are registries, not closed unions
  R-HALT:
    body: while cancellation is Unconfirmed the system state is HALTED
    checks:
    - 'fail_closed: CancelAllStatus.Unconfirmed => HaltState.HALTED'
  R-REQ:
    body: a ForecastRequest may only be answered by a PathLaw it matches on instrument, link,
      target interval, horizon and knowledge time; every one of these is COMPARED at query
      time, not merely carried
    checks:
    - 'instrument_eq: ForecastRequest.instrument == PathLaw.instrument'
    - 'link_eq: ForecastRequest.link_ref == PathLaw.link_ref == BeliefProcess.link'
    - 'target_eq: ForecastRequest.target_interval == PathLaw.target_interval'
    - 'horizon_consistent: request.as_of + request.horizon == target_interval.end and request.horizon
      in ReducedFormPathLaw.by_horizon'
    - 'knowledge_order: ForecastRequest.knowledge_cutoff <= ForecastRequest.as_of'
    - 'no_future_train_req: law.fit_data_through <= ForecastRequest.knowledge_cutoff'
    - 'law_not_from_the_future: ReducedFormPathLaw.as_of <= ForecastRequest.as_of'
    - 'interval_well_formed: TargetInterval.start < TargetInterval.end'
    - 'observables_not_ahead: AnchorObservables.t_known <= knowledge_cutoff'
    - 'coverage: request.as_of within law coverage'
    - 'atomic: these run INSIDE pricing_distribution, before either moment is computed, and
      mean and variance come from the same validated fit. v15 exposed them as an optional
      helper the pricing accessors did not call, so correctness depended on every caller remembering
      a pre-call'
    - 'refusal_provenance: every boundary refusal carries since and a machine-actionable cause'
  R-ROUTE:
    body: PathLaw is a discriminated union; only the ReducedForm arm answers a pricing query,
      and reduced-form residuals are never summed with structural lines. BOTH directions are
      typed, not conventional
    checks:
    - 'no_mixing: pricing reads ReducedFormFit.resid_var only; k_law, AnchorSpec and FeedErrorCov
      are never added to it'
    - 'no_structural_pricing: StructuralDiagnosticLaw exposes no settlement_var and no pricing_distribution,
      so a probability consumer cannot bind to it'
    - 'type_boundary: enforced by the union and by DiagnosticVarianceDecomposition carrying
      no pricing protocol, NOT by a key-name convention, which v15 mistook for a boundary'
  R-WFWD:
    body: a fitted law declares fit_data_through <= as_of and reads no training data beyond
      that cutoff; being USED after the cutoff is the point, not a violation
    checks:
    - 'cutoff_order: PathLaw.fit_data_through <= PathLaw.as_of'
    - 'no_future_train: training reads truncated at fit_data_through, enforced through StateView
      knowledge time, never payload time'
  R-IMPUTE:
    body: t_known is never manufactured from t_event; OBSERVED requires recv_ns, and every
      non-observed value carries a named imputation rule with positive delay and error
    checks:
    - 'observed_needs_wire: Known.t_known_prov == OBSERVED => SourceProfile.has_recv_ns'
    - 'strict_delay: Known.t_known_prov != OBSERVED => Known.t_known > Known.t_event'
    - 'rule_named: Known.t_known_prov != OBSERVED => Known.imputation_rule is not null'
  R-REFUSE:
    body: StateView admits a Known only when t_known plus refuse_k times t_known_err is no
      later than its supplied KnowledgeTime now
    checks:
    - 'no_peek: admitted(k, now) => k.t_known + refuse_k * k.t_known_err <= now'
    - 'telemetry: every refusal increments RefusalLedger for the requested field'
  R-ADMISS:
    body: Coverage is factual and separate from an AdmissibilityDecision; only a FROZEN hash-verified
      rule may exclude a unit, and EXCLUDE_UNIT requires the paired indicator arm
    checks:
    - 'frozen_rule: AdmissibilityDecision requires AdmissibilityRule.status == FROZEN'
    - 'hash_match: recomputed rule content hash == AdmissibilityRule.spec_hash'
    - 'two_arms: on_fail == EXCLUDE_UNIT => required_gap_arm == BOTH'
  R-CANARY:
    body: every replay diagnostic runs paired StateView and deliberately leaky EventTimeView
      reads; EventTimeView is constructible only by the canary harness and is never exposed
      on a production port
    checks:
    - 'harness_only: direct EventTimeView construction is fatal'
    - 'guard_binds: LeakCanary.event_only_boundary_reads > 0 and LeakCanary.decision_disagreements
      > 0'
    - 'telemetry: LeakCanary carries the StateView refusal counts'
  R-BATCH:
    body: a measurement batch preflights every requested coin before mutation, has one shared
      writer, validates every per-coin artifact binding, and emits its immutable COMPLETE
      receipt only after every requested bundle passes; uncommitted per-coin artifacts are
      resumable staging, never batch completion
    checks:
    - 'preflight_all: all MeasurementBatchPlan per-coin plans are ready before the first partition
      write'
    - 'single_writer: one exclusive batch lock covers every partition, canary, health record
      and receipt write'
    - 'validate_all: every MeasurementBatchRun per_coin_health_hashes value identifies a PASS
      BundleHealth'
    - 'commit_last: MeasurementBatchRun.status == COMPLETE only after every requested coin
      has a bound run and health hash'
    - 'resumable: absence of MeasurementBatchRun permits immutable per-coin artifacts to be
      validated and reused, never treated as complete'
  R-DERIVE:
    body: Tier-2 evaluation artifacts consume only a validated COMPLETE full-lane MeasurementBatchRun;
      every derived partition binds that batch hash and its exact Tier-1 input manifests,
      and the cross-coin evaluation receipt is emitted last
    checks:
    - 'full_batch_only: EvaluationPipelineRun.source_batch_lane == full'
    - 'input_binding: every derived DatasetPartition binds its MeasurementBatchRun batch_hash
      and exact source manifest hashes'
    - 'commit_last: EvaluationPipelineRun.status == COMPLETE only after every requested MARKOUT_EVENTS
      and CALIB_PANEL partition validates'
  R-GROSS:
    body: terminal maker markout is gross of fees, rebates and incentives; an unresolved cash
      term may not be silently read from the websocket zero field
    checks:
    - 'terminal_identity: maker_edge_per_share == q_up * (price_up - outcome_up)'
    - 'no_fee_in_markout: TerminalMarkoutObservation.fee_status == GROSS_ONLY_NOT_APPLIED'
  R-DUAL:
    body: every economic markout summary reports both per-fill and share-weighted estimates
      per coin and phase; neither may substitute for or hide the other
    checks:
    - 'both_weights: MarkoutSummary carries per_fill_cents and share_weighted_cents from the
      same retained rows'
    - 'no_pooled_primary: per-coin summaries are primary and any pooled summary is diagnostic
      only'
  R-ONEROW:
    body: the calibration scaffold contains exactly one row per window and frozen decision
      horizon, including an explicit unavailable row when no quote is knowledge-admissible
    checks:
    - 'identity: unique CalibrationPanelRow key is (slug, r_s)'
    - 'complete_grid: each closed window has exactly the nine frozen r_s values'
    - 'no_silent_drop: unavailable or invalid quote states remain rows with a named quote_status'
  R-FLOW:
    body: flow is a per-coin marked point process; every conditional arrival and its exposure
      use the same knowledge-admissible state, side and notional are marks rather than total-intensity
      covariates, and a Hawkes residual is admitted only after a forward-valid baseline time
      change
    checks:
    - 'same_state: FlowArrival.state and its exposure interval come from the same StateView
      with the frozen 250 ms lag; execution price never selects the state bin'
    - 'gap_kills_state: a collector gap ends the admitted state and a new quote must mature
      through the lag before either numerator or exposure resumes'
    - 'count_compensator_only: ArrivalIntensityFit is events/s; NotionalThroughput is USDC/s
      derived from intensity times a conditional monetary mark and has no point-process compensator'
    - 'native_notional: FlowArrival.notional_usdc == size_shares * native_price'
    - 'same_conditioning: NotionalThroughput intensity_ref and mark_law_ref share one conditioning_schema'
    - 'side_is_mark: total arrival intensity does not consume the realized next-event side;
      side is conditional on an arrival or represented by reconciled cause-specific intensities'
    - 'per_coin: primary fit and verdict are coin-scoped; pooling is diagnostic only'
    - 'label_not_independence: MARKET is a labelled subprocess; micro/market independence
      is a tested null, not an estimation prerequisite'
    - 'forward_only: fit_data_through < the first scored evaluation day'
    - 'hawkes_gate: HawkesResidualFit requires a full-baseline TimeChangeDiagnostic, at least
      ten complete forward days, and a bootstrap spectral-radius upper bound below one'
  R-FILL:
    body: action-conditional fills are derived from complement-folded execution prices and
      sizes; public level-total books identify only a front/back queue bracket, and only a
      forward-validated bound artifact may reach a decision consumer
    checks:
    - 'action_binding: every FillQuantityBound binds the exact FlowAction, initial QueuePositionBound,
      arrival fit, mark laws, knowledge-state hash and horizon'
    - 'execution_reach: a BUY aggressor reaches SELL_UP only at or above the action level
      and a SELL aggressor reaches BUY_UP only at or below it, after Down-to-Up complement
      folding'
    - 'front_bound: front_filled_shares == min(action.size_shares, cumulative_reaching_shares)'
    - 'back_bound: back_filled_shares == min(action.size_shares, max(0, cumulative_reaching_shares
      - queue.upper_ahead_shares))'
    - 'partial_first_class: fill quantities are shares in [0, action.size_shares] and any-fill,
      completion and first-fill time are derived separately at both bounds'
    - 'gap_refusal: a collector gap crossing an action horizon yields an explicit UNAVAILABLE
      FillQuantityBound and never carries pre-gap queue state'
    - 'no_midpoint: the midpoint of front/back queue results is diagnostic only and cannot
      be a decision result'
    - 'validated_only: BE-FlowAndFills consumes FlowActionFillFit only when status == VALIDATED;
      DEVELOPMENT and CANDIDATE_FROZEN remain unavailable'
  R-ADVERSE:
    body: adverse-movement prediction is action- and maker-side-specific, uses only features
      admitted at knowledge time, models toxic fill and markout jointly, remains gross of
      spread/rebates/incentives, and may reach a decision only after forward validation under
      the currently measured cancellation-latency profile
    checks:
    - 'knowledge_only: every feature used by AdverseMoveEstimate has t_known <= estimate.as_of
      and was admitted by StateView under R-REFUSE'
    - 'offline_online_parity: AdverseFeatureRow.feature_schema_hash and state construction
      match the decision-time builder bound by AdverseMoveFit.feature_schema_hash'
    - 'strictly_pre_fill: the event that first reveals or causes a candidate fill is never
      a feature of an estimate whose as_of precedes that fill'
    - 'action_binding: AdverseMoveEstimate.action_hash binds the exact action, maker side,
      level, size, state hash, prediction horizon and markout horizon being evaluated'
    - 'joint_target: p_toxic_fill_if_kept and expected markout are action-conditional joint
      fill/markout quantities; fill probability and adverse movement are never multiplied
      under an undeclared independence assumption'
    - 'latency_binding: estimate.latency_profile_ref matches both its fit and the currently
      admitted measured cancellation profile; mismatch or stale inputs return Unavailable'
    - 'gross_model: AdverseMoveEstimate excludes spread, fees, rebates and incentives; those
      enter only through ActionOutcome cash flows and WealthLedger'
    - 'economic_gate: classification accuracy is diagnostic; validation is decided by the
      frozen cancel replay net of lost spread, rebate, queue position and actuation latency'
    - 'validated_only: BE-FlowAndFills consumes AdverseMoveFit only when status == VALIDATED
      and its matching AdverseMoveEvaluation verdict is PASS'
    - 'whole_action_decision: DE compares Uncertain[ActionOutcome] for keep versus cancel and
      never acts on bare p_toxic_fill_if_kept'
types:
  Known:
    generic:
    - V
    fields:
      value: V
      t_event: EventTime
      t_known: KnowledgeTime
      t_known_prov: enum:OBSERVED|IMPUTED|ASSUMED
      t_known_err: Duration
      imputation_rule: ImputationRuleId?
      seq: int
      source: SourceId
      provenance: Provenance
  SourceProfile:
    fields:
      source: SourceId
      has_recv_ns: bool
      transport: enum:LOCAL_WS|LOCAL_REST_POLL|ARCHIVE|ONCHAIN|DERIVED
      clock_err: Duration
      default_imputation_rule: ImputationRuleId?
  ImputationRule:
    fields:
      id: ImputationRuleId
      applies_to: SourceId
      delay: Duration
      error: Duration
      calibrated_from: SourceId?
      calibration_overlap: (EventTime, EventTime)?
      bias_direction: enum:OPTIMISTIC|PESSIMISTIC
      artifact_id: ImmutableId?
  Uncertain:
    generic:
    - T
    methods:
      expectation: () -> T
      quantile: '(q: float) -> T'
      draws: '(n: int, rng: Rng) -> ScenarioDrawSet[T]'
      combine: '(other: Uncertain[U], f, dependence: Dependence) -> Uncertain[W]'
    notes: combine REFUSES when dependence is unknown; never assumes independence
  ScenarioDrawSet:
    generic:
    - T
    fields:
      draws: 'list[(DrawId, weight: float, value: T)]'
      common_random_id: CommonRandomId
  Dependence:
    variants:
    - SharedDraws(common_random_id)
    - JointLaw(copula|factor)
    - Independent(DECLARED)
  Unavailable:
    fields:
      reason: str
      since: Timestamp
      cause: Unavailable?
  NullPin:
    fields:
      field: str
      assumption: str
      bias_direction: enum:OPTIMISTIC|PESSIMISTIC
      declared_by: ModuleId
  InstrumentId:
    fields:
      venue: VenueId
      condition_id: ImmutableId
      symbol: str
      horizon: Duration
      expiry: Timestamp
      slug: str?
  TokenId:
    fields:
      instrument: InstrumentId
      side: enum:UP|DOWN
      asset_id: ImmutableId
  ParamId:
    fields:
      namespace: ModuleOrPluginId
      name: str
  ScopeKey:
    fields:
      venue: VenueId?
      factor: RiskFactorId?
      instrument: InstrumentId?
      horizon: Duration?
      feed: FeedId?
      region: RegionId?
      portfolio: PortfolioId?
      scenario: ScenarioId?
    notes: subset-order resolution; equally-specific matches FAIL LOUD
  AdverseScenario:
    fields:
      id: ScenarioId
      outcome_map: dict[InstrumentId, VenueOutcome]
      scope: ScopeKey
      provenance: Provenance
      completeness: enum:COMPLETE|PARTIAL
      on_incomplete: enum:REFUSE|WORST_CASE_FILL
    notes: 'adversity is a function of (outcome, position, action) evaluated at decision time,
      so it cannot be stored as stable SP data. Loss limit lives ONLY in SP-Params keyed by
      ScopeKey.scenario (single owner, R-SSOT).

      '
  AdverseScenarioSet:
    fields:
      scenarios: dict[ScenarioId, AdverseScenario]
  JointOutcomeDistribution:
    fields:
      support: 'list[(JointOutcome, weight: float)]'
      dependence: Dependence
    notes: 'M9-3: each support point is ONE JointOutcome, not a whole scenario set'
  RiskScenarios:
    variants:
    - Declared(Known[AdverseScenarioSet])
    - Estimated(Known[JointOutcomeDistribution])
    - Unavailable
  CompetitionState:
    fields:
      rival_score: float
      our_marginal_effect: float
      total_participation: float
      eligibility_state: EligibilityState
  JointCompetitionState:
    fields:
      by_node: dict[NodeId, CompetitionState]
    notes: 'realised sample only. Dependence describes CONSTRUCTION of the joint uncertainty
      and therefore lives on the aggregator/distribution, not here (M8-1). Keys restricted
      to node kinds that can carry competition state.

      '
  UtilityFunctional:
    kind: open_protocol
    protocol:
      evaluate: (Uncertain[Wealth]) -> Value
      config_schema: JsonSchema
    registry: PluginRegistry
    builtin_ids:
    - risk_neutral
    - cara
    - path_functional
  ControlSolver:
    kind: open_protocol
    protocol:
      solve: (DecisionProblem) -> Decision
      config_schema: JsonSchema
    registry: PluginRegistry
    builtin_ids:
    - closed_form_glft
    - per_level
    - hjb_qvi
  DecisionSchemeConfig:
    fields:
      utility: PluginRef
      solver: PluginRef
      unwrap_policy: UnwrapPolicy
      unavailable_policy: UnavailablePolicy
      coupling_mode: CouplingMode
      incentive_model: PluginRef
    validation: n_ary_capability_check
  StaticCouplingRef:
    fields:
      graph_id: str
      hash: Hash
      provenance: Provenance
  DecisionProblem:
    fields:
      view: StateView
      self: SelfState
      belief: Known[BeliefProcess] | Unavailable
      competition: Known[Uncertain[JointCompetitionState]] | Unavailable
      outcomes: PinnedOutcomes
      actions: ActionSpace
      portfolio: PortfolioState
      risk_scenarios: RiskScenarios
      coupling: ResolvedCoupling
      constraints: ConstraintSet
      incentives: ResolvedContracts
      horizon: Duration
      spec_snapshot: Hash
  ResolvedContracts:
    fields:
      by_instrument: dict[InstrumentId, Known[IncentiveContract] | Unavailable]
      spec_hash: Hash
      incentive_plugin: PluginRef
    notes: pre-resolved against the problem's spec snapshot; Disputed invokes the declared
      handler
  HealthEvent:
    fields:
      id: str
      source_port: TelemetryPortId
      severity: enum:INFO|WARN|FAULT
      observed_at: Timestamp
      detail: str
  HaltState:
    fields:
      level: enum:RUNNING|DEGRADED|HALTED
      latched: bool
      since: Timestamp
      reason: list[HealthEvent]
      reset_authority: enum:OP_OWNER_ONLY
    notes: monotonic escalation; de-escalation only by operator; unknown health => HALTED
  CancelAllCommand:
    fields:
      command_id: ImmutableId
      idempotency_key: str
      issued_at: Timestamp
      deadline: Timestamp
      backoff: BackoffPolicy
      rate_budget_class: enum:PRIORITY
  CancelAllStatus:
    variants:
    - 'Issued(command_id: ImmutableId)'
    - 'Confirmed(command_id: ImmutableId, confirmed_by: ConfirmationSource)'
    - 'Unconfirmed(command_id: ImmutableId, open_orders_remaining: int)'
    - 'FailedTerminal(command_id: ImmutableId, reason: str)'
    notes: venue ack is NOT observed; confirmation is by open-order reconciliation, and while
      Unconfirmed the conservative state is HALTED (rule R-HALT.fail_closed)
  Gate:
    fields:
      id: GateId
      status: enum:DRAFT|FROZEN|SUPERSEDED|RETIRED
      superseded_by: GateId?
      bar: GateBar
      bar_provenance: Provenance
      bar_input_snapshot: dict[str, ProvenancedValue]
      bound_kind_derived_from: bar
      null_hypothesis: str
      favourable_arm: enum:UPPER|LOWER
      preconditions: list[Precondition]
      on_fail: FailRoute
      on_verdict: FailRoute
      code_hash: Hash
      conformance_ref: ImmutableId
      vacuity_control_ref: ImmutableId
      firing_witness_ref: ImmutableId
      mde_at_declared_n: float | NullPin
      verdict_map: dict[str, VerdictState]
      outcome_space: list[str]
      review_date: Date
  JointOutcome:
    fields:
      outcomes: dict[InstrumentId, VenueOutcome]
      scenario_ref: ScenarioId?
      completeness: enum:COMPLETE|PARTIAL
      on_incomplete: enum:REFUSE|WORST_CASE_FILL
    notes: ONE realization of venue outcomes across instruments
  ParamValue:
    fields:
      value: any
      provenance: Provenance
      owner: ModuleId
      valid_for: ScopeKey
      measured_at: Timestamp
      fit_data_through: Timestamp?
      artifact_id: ImmutableId?
      valid_from: Timestamp?
      valid_to: Timestamp?
  SP-Params:
    fields:
      entries: dict[(ParamId, ScopeKey), ParamValue]
    notes: SOLE owner of ScenarioLossLimit — enforced by rule R-SSOT.loss_limit_owner
  ScenarioLossLimit:
    fields:
      param: ParamId
      scope: ScopeKey
      resolved: Known[Money] | Unavailable
      unit: str
  LossFunctional:
    protocol:
      loss: (JointOutcome, PortfolioState, ActionSet) -> Wealth
    notes: adversity computed at decision time from outcome+position+action (M8-2)
  ScenarioLossConstraint:
    fields:
      kind: enum:HARD
      limit: ScenarioLossLimit
      loss_fn: LossFunctional
      scope: ScopeKey
    notes: consumed by DE-Constraints; budget split by DE-Allocator
  IncentiveContract:
    fields:
      payout: PayoutFunctional
      obligations: list[Constraint]
      instrument: InstrumentId
      valid_for: ScopeKey
  PayoutFunctional:
    protocol:
      cash: (ActionOutcome, Known[Uncertain[JointCompetitionState]], InstrumentId) -> Uncertain[Wealth]
    notes: 'M10-4: takes the JOINT wrapper plus an instrument projection, not a scalar'
  IncentiveModel:
    kind: open_protocol
    registry: PluginRegistry
    protocol:
      contract_spec: (InstrumentId) -> Known[IncentiveContract] | Unavailable
      competition_model: () -> ModuleRef
      constraints: () -> list[Constraint]
      cashflow_emitter: () -> PayoutFunctional
    notes: 'M9-4: ONE registration supplies all four contributions; adding a principal-agent/contest
      theory is a plug-in, not a four-file edit'
  PluginRef:
    fields:
      registry: str
      plugin_id: str
      config: JsonSchema
      artifact_id: ImmutableId?
      version: str
  ModuleManifest:
    fields:
      inputs: list[str]
      outputs: list[str]
      ports_required: list[str]
      capabilities_required: list[str]
      stateful: bool
      artifacts: list[ImmutableId]
      null_semantics: dict[str, NullPin]
  UnwrapPolicy:
    fields:
      by_input: dict[str, UnwrapSpec]
  FallbackPolicy:
    fields:
      prior_ref: ImmutableId
      max_age: Duration
      provenance: Provenance
      admissible_when: str
    notes: 'M9-4.3: FALL_BACK needs a referenced prior with an age bound'
  PinnedOutcomes:
    fields:
      model: PluginRef
      spec_hash: Hash
    protocol:
      evaluate: (ActionSet, StateView, SelfState, Duration) -> Uncertain[ActionOutcome] |
        Unavailable
    notes: 'M10-5: identity lives in PluginRef (single copy); still callable'
  HeartbeatRegistration:
    fields:
      port: TelemetryPortId
      period: Duration
      staleness_deadline: Duration
  HeartbeatPulse:
    fields:
      port: TelemetryPortId
      seq: int
      observed_at: Timestamp
  PortLiveness:
    fields:
      port: TelemetryPortId
      last_seen: Timestamp?
      state: enum:LIVE|STALE|UNKNOWN
    notes: UNKNOWN => fail-closed HALTED; computed from registration + pulses + monitor clock
  StateView:
    methods:
      get: '(field: str) -> Known[any] | Unavailable'
      history: '(field: str, span: Duration) -> list[Known[any]]'
      coverage: '(field: str, span: Duration) -> Known[Coverage] | Unavailable'
      refusals: () -> RefusalLedger
    fields:
      now: KnowledgeTime
      spec_snapshot: Hash
    notes: the ONLY read entry point; bound to a KnowledgeTime `now`
  EventTimeView:
    methods:
      get: '(field: str) -> Known[any] | Unavailable'
      history: '(field: str, span: Duration) -> list[Known[any]]'
    fields:
      now: EventTime
    notes: deliberately leaky R-CANARY twin; not reachable from any production port
  LeakCanary:
    fields:
      metric: str
      value_knowledge_time: float
      value_event_time: float
      delta: float
      n: int
      knowledge_hits: int
      event_hits: int
      decision_disagreements: int
      event_only_boundary_reads: int
      skipped: int
      status: enum:VALID_GUARD_BITES|BOUND_ZERO_SCORE_DELTA|INVALID_UNBOUND_GUARD
      reference_delta_pp: float
      refusal_counts: dict[str, RefusalCount]
    notes: score delta may cancel on a small slice; event-only selected reads and decision
      disagreements prove the guard is wired
  MeasurementPipelineRun:
    fields:
      pipeline_version: str
      pipeline_code_sha256: Hash
      plan_hash: Hash
      target_day: str
      coin: str
      lane: enum:measurement|full
      partition_manifests: list[Hash]
      canary_report_hash: Hash
      status: enum:COMPLETE
      run_hash: Hash
    notes: atomic content-addressed receipt emitted only after every planned partition and
      the bound leak canary complete
  BundleHealth:
    fields:
      validator_version: str
      validator_code_sha256: Hash
      target_day: str
      coin: str
      lane: enum:measurement|full
      checks: dict[str, JsonSchema]
      manifest_hashes: dict[str, Hash]
      canary_report_hash: Hash?
      per_coin_run_hash: Hash?
      status: enum:PASS|FAIL
      health_hash: Hash
    notes: content-addressed cross-partition validation result; FAIL can be retained for diagnosis
      but cannot enter a batch receipt
  MeasurementCoinPlan:
    fields:
      pipeline_version: str
      target_day: str
      coin: str
      lane: enum:measurement|full
      as_of_day: str
      ready: bool
      checks: list[JsonSchema]
      stages: list[str]
      plan_hash: Hash
  MeasurementBatchPlan:
    fields:
      batch_version: str
      target_day: str
      lane: enum:measurement|full
