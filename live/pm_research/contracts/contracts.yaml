    - DatasetPartition
    - LeakCanary
    produces:
    - MeasurementBatchPlan
    - MeasurementPipelineRun
    - BundleHealth
    - MeasurementBatchRun
    - HealthEvent
    ports:
    - read_all
    - telemetry_out
    notes: offline research composition root for R-BATCH; it exposes no venue or decision
      port
  EV-SideConvention:
    produces:
    - SideConventionEvidence
    ports:
    - read_all
    notes: offline frozen G-FF1 evidence loader; no decision-facing port
  EV-Markout:
    consumes:
    - MeasurementBatchRun
    - DatasetPartition
    - SideConventionEvidence
    produces:
    - TerminalMarkoutObservation
    - MarkoutSummary
    - DatasetPartition
    - HealthEvent
    ports:
    - read_all
    notes: computes gross model-free TO_RESOLUTION maker markout under R-GROSS/R-DUAL
  EV-Calibration:
    consumes:
    - MeasurementBatchRun
    - DatasetPartition
    produces:
    - CalibrationPanelRow
    - DatasetPartition
    - HealthEvent
    ports:
    - read_all
    notes: materializes the R-ONEROW book scaffold; model and isotonic arms remain unavailable
  EV-Orchestrate:
    consumes:
    - MeasurementBatchRun
    - DatasetPartition
    - SideConventionEvidence
    produces:
    - EvaluationPipelineRun
    - HealthEvent
    ports:
    - read_all
    notes: offline R-DERIVE composition root; it exposes no state, venue or decision port
  DE-Constraints:
    consumes:
    - DecisionProblem
    - HaltState
    - ScenarioLossConstraint
    - CapitalBudget
    produces:
    - FeasibleSet
    - HealthEvent
    - HeartbeatPulse
    ports:
    - state_view
    - halt_in
    - telemetry_out
  DE-Actuator:
    consumes:
    - Decision
    - CancelAllCommand
    - CapitalOpCommand
    produces:
    - CancelAllStatus
    - HeartbeatPulse
    ports:
    - venue
    - halt_in
    - cancel_cmd_in
    - telemetry_out
    - capital_cmd_in
  OP-Monitor:
    consumes:
    - HealthEvent
    - HeartbeatRegistration
    - HeartbeatPulse
    - CancelAllStatus
    produces:
    - HaltState
    - CancelAllCommand
    notes: 'M9-5: OP produces BOTH state and command; v9 had no producer for the command'
  DA-Feeds:
    produces:
    - RawEvent
    - HeartbeatPulse
    ports:
    - feed
    - telemetry_out
  DE-Allocator:
    consumes:
    - PortfolioState
    - ScenarioLossConstraint
    - SettlementFacts
    produces:
    - CapitalBudget
    - CapitalOpCommand
    - HealthEvent
    - HeartbeatPulse
    ports:
    - state_view
    - capital_cmd_out
    - telemetry_out
  DA-Settlement:
    produces:
    - SettlementFacts
    ports:
    - feed
  EV-Gates:
    consumes:
    - GateEvidence
    - SideConventionEvidence
    produces:
    - Gate
    - GateRegistry
    - GateVerdictLedger
    ports:
    - read_all
    - artifact_resolver
  SP-SpecResolver:
    produces:
    - ResolvedContracts
    ports:
    - spec_out
    notes: 'SP §7(1): without it DecisionProblem.spec_snapshot and ResolvedContracts.spec_hash
      have no producer.'
  # --- v25 (R-397, USER ruling 2026-09-02): DE registry amendment A-D applied; E HELD behind BE confirmation (proposal section 2.3) ---
  EV-Replay:
    consumes:
    - ReplayWindowSpec
    produces:
    - RunRecord
    - ReplayReceipt
    ports:
    - read_all
    notes: 'offline replay ENVIRONMENT (architecture section 9): Live/Replay/Sim
      are implementations behind the same ports, and the replay clock plus tape
      port go to the replay runner alone. EV reads all planes and is read by
      none, so no output of this module may enter a policy loop: evaluation runs
      as a separate pass over a completed RunRecord. Window selection is NOT this
      module job and is supplied, never chosen. The registered-plugin path and
      artifact resolution are NOT IN v1; a DecisionProblem consume edge enters
      only when that path is built, and adding it earlier would record a seam
      that does not exist.'
  DE-ActionSpace:
    consumes:
    - HaltState
    - PortfolioState
    - FeasibleSet
    produces:
    - ActionSet
    ports:
    - state_view
    - telemetry_out
    notes: 'the action MENU enumerator: given halt state, position, resting
      quotes and the feasibility oracle side-keyed map, it emits the FINITE menu
      of venue-EXPRESSIBLE actions the solver may choose among. The oracle says
      what is feasible; this module says what is expressible, and the menu is
      the intersection. It owns ONE fact: the venue floor orderMinSize = 5, so
      an action the oracle caps below the floor is feasible and INEXPRESSIBLE
      and is omitted as a typed fact, never truncated silently. Menu
      construction is DEFAULT-DENY end to end. It does NOT produce the type
      ActionSpace, which is a verb menu derived from VenueCapabilities: the
      module emits concrete Actions, and conflating the two would put the
      name-is-not-the-definition defect into the registry.'
