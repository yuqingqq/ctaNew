version: 14
rules:
  R-SSOT:
    body: every canonical name has exactly one owning type/module
    checks:
    - 'loss_limit_owner: ScenarioLossLimit only in SP-Params'
  R-KNOW:
    body: no API accepts event time; derived t_known = MAX(inputs)
  R-ONCE:
    body: MarkoutPartition, WealthLedger, VarianceGroup are disjoint registries
  R-PROV:
    body: assumed-provenance params may not gate a decision
  R-VERSION:
    body: 'specs bitemporal: observed_at + validity interval'
  R-NULL:
    body: nulls are field-level NullPin with a bias direction
  R-PORT:
    body: only the composition root sees Environment; modules take declared ports
  R-COMPAT:
    body: n-ary validation over (utility, solver, coupling)
  R-ENV:
    body: no module reads a wall clock
  R-OPEN:
    body: utility/solver/incentive are registries, not closed unions
  R-HALT:
    body: while cancellation is Unconfirmed the system state is HALTED
    checks:
    - 'fail_closed: CancelAllStatus.Unconfirmed => HaltState.HALTED'
  R-WFWD:
    body: a fitted law declares fit_data_through <= as_of and reads no training
      data beyond that cutoff; being USED after the cutoff is the point, not a
      violation
    checks:
    - 'cutoff_order: PathLaw.fit_data_through <= PathLaw.as_of'
    - 'no_future_train: training reads truncated at fit_data_through, enforced
       through StateView knowledge time, never payload time'
types:
  Known:
    generic:
    - V
    fields:
      value: V
      t_event: Timestamp
      t_known: Timestamp
      t_known_prov: enum:OBSERVED|IMPUTED|ASSUMED
      t_known_err: Duration
      source: SourceId
      provenance: Provenance
  Uncertain:
    generic:
    - T
    methods:
      expectation: () -> T
      quantile: '(q: float) -> T'
      draws: '(n: int, rng: Rng) -> ScenarioDrawSet[T]'
      combine: '(other: Uncertain[U], f, dependence: Dependence) -> Uncertain[W]'
    notes: combine REFUSES when dependence is unknown; never assumes independence
  ScenarioDrawSet:
    generic:
    - T
    fields:
      draws: 'list[(DrawId, weight: float, value: T)]'
      common_random_id: CommonRandomId
  Dependence:
    variants:
    - SharedDraws(common_random_id)
    - JointLaw(copula|factor)
    - Independent(DECLARED)
  Unavailable:
    fields:
      reason: str
      since: Timestamp
      cause: Unavailable?
  NullPin:
    fields:
      field: str
      assumption: str
      bias_direction: enum:OPTIMISTIC|PESSIMISTIC
      declared_by: ModuleId
  InstrumentId:
    fields:
      venue: VenueId
      condition_id: ImmutableId
      symbol: str
      horizon: Duration
      expiry: Timestamp
      slug: str?
  TokenId:
    fields:
      instrument: InstrumentId
      side: enum:UP|DOWN
      asset_id: ImmutableId
  ParamId:
    fields:
      namespace: ModuleOrPluginId
      name: str
  ScopeKey:
    fields:
      venue: VenueId?
      factor: RiskFactorId?
      instrument: InstrumentId?
      horizon: Duration?
      feed: FeedId?
      region: RegionId?
      portfolio: PortfolioId?
      scenario: ScenarioId?
    notes: subset-order resolution; equally-specific matches FAIL LOUD
  AdverseScenario:
    fields:
      id: ScenarioId
      outcome_map: dict[InstrumentId, VenueOutcome]
      scope: ScopeKey
      provenance: Provenance
      completeness: enum:COMPLETE|PARTIAL
      on_incomplete: enum:REFUSE|WORST_CASE_FILL
    notes: 'adversity is a function of (outcome, position, action) evaluated at decision time, so it cannot
      be stored as stable SP data. Loss limit lives ONLY in SP-Params keyed by ScopeKey.scenario (single
      owner, R-SSOT).

      '
  AdverseScenarioSet:
    fields:
      scenarios: dict[ScenarioId, AdverseScenario]
  JointOutcomeDistribution:
    fields:
      support: 'list[(JointOutcome, weight: float)]'
      dependence: Dependence
    notes: 'M9-3: each support point is ONE JointOutcome, not a whole scenario set'
  RiskScenarios:
    variants:
    - Declared(Known[AdverseScenarioSet])
    - Estimated(Known[JointOutcomeDistribution])
    - Unavailable
  CompetitionState:
    fields:
      rival_score: float
      our_marginal_effect: float
      total_participation: float
      eligibility_state: EligibilityState
  JointCompetitionState:
    fields:
      by_node: dict[NodeId, CompetitionState]
    notes: 'realised sample only. Dependence describes CONSTRUCTION of the joint uncertainty and therefore
      lives on the aggregator/distribution, not here (M8-1). Keys restricted to node kinds that can carry
      competition state.

      '
  UtilityFunctional:
    kind: open_protocol
    protocol:
      evaluate: (Uncertain[Wealth]) -> Value
      config_schema: JsonSchema
    registry: PluginRegistry
    builtin_ids:
    - risk_neutral
    - cara
    - path_functional
  ControlSolver:
    kind: open_protocol
    protocol:
      solve: (DecisionProblem) -> Decision
      config_schema: JsonSchema
    registry: PluginRegistry
    builtin_ids:
    - closed_form_glft
    - per_level
    - hjb_qvi
  DecisionSchemeConfig:
    fields:
      utility: PluginRef
      solver: PluginRef
      unwrap_policy: UnwrapPolicy
      unavailable_policy: UnavailablePolicy
      coupling_mode: CouplingMode
      incentive_model: PluginRef
    validation: n_ary_capability_check
  StaticCouplingRef:
    fields:
      graph_id: str
      hash: Hash
      provenance: Provenance
  DecisionProblem:
    fields:
      view: StateView
      self: SelfState
      belief: Known[BeliefProcess]
      competition: Known[Uncertain[JointCompetitionState]] | Unavailable
      outcomes: PinnedOutcomes
      actions: ActionSpace
      portfolio: PortfolioState
      risk_scenarios: RiskScenarios
      coupling: ResolvedCoupling
      constraints: ConstraintSet
      incentives: ResolvedContracts
      horizon: Duration
      spec_snapshot: Hash
  ResolvedContracts:
    fields:
      by_instrument: dict[InstrumentId, Known[IncentiveContract] | Unavailable]
      spec_hash: Hash
      incentive_plugin: PluginRef
    notes: pre-resolved against the problem's spec snapshot; Disputed invokes the declared handler
  HealthEvent:
    fields:
      id: str
      source_port: TelemetryPortId
      severity: enum:INFO|WARN|FAULT
      observed_at: Timestamp
      detail: str
  HaltState:
    fields:
      level: enum:RUNNING|DEGRADED|HALTED
      latched: bool
      since: Timestamp
      reason: list[HealthEvent]
      reset_authority: enum:OP_OWNER_ONLY
    notes: monotonic escalation; de-escalation only by operator; unknown health => HALTED
  CancelAllCommand:
    fields:
      command_id: ImmutableId
      idempotency_key: str
      issued_at: Timestamp
      deadline: Timestamp
      backoff: BackoffPolicy
      rate_budget_class: enum:PRIORITY
  CancelAllStatus:
    variants:
    - 'Issued(command_id: ImmutableId)'
    - 'Confirmed(command_id: ImmutableId, confirmed_by: ConfirmationSource)'
    - 'Unconfirmed(command_id: ImmutableId, open_orders_remaining: int)'
    - 'FailedTerminal(command_id: ImmutableId, reason: str)'
    notes: venue ack is NOT observed; confirmation is by open-order reconciliation, and while Unconfirmed
      the conservative state is HALTED (rule R-HALT.fail_closed)
  Gate:
    fields:
      id: str
      question: str
      metric: str
      threshold: float
      unit: str
      data_prereq: str
      owner: str
      preconditions: list[GateId]
      on_pass: str
      on_fail: str
      review_date: Date
      inference_method: str
      strata_hash: Hash
      spec_hash: Hash
      artifact_hash: Hash
      frozen_at: Timestamp
  JointOutcome:
    fields:
      outcomes: dict[InstrumentId, VenueOutcome]
      scenario_ref: ScenarioId?
      completeness: enum:COMPLETE|PARTIAL
      on_incomplete: enum:REFUSE|WORST_CASE_FILL
    notes: ONE realization of venue outcomes across instruments
  ParamValue:
    fields:
      value: any
      provenance: Provenance
      owner: ModuleId
      valid_for: ScopeKey
      measured_at: Timestamp
      fit_data_through: Timestamp?
      artifact_id: ImmutableId?
  SP-Params:
    fields:
      entries: dict[(ParamId, ScopeKey), ParamValue]
    notes: "SOLE owner of ScenarioLossLimit \u2014 enforced by rule R-SSOT.loss_limit_owner"
  ScenarioLossLimit:
    fields:
      param: ParamId
      scope: ScopeKey
      resolved: Known[Money] | Unavailable
      unit: str
  LossFunctional:
    protocol:
      loss: (JointOutcome, PortfolioState, ActionSet) -> Wealth
    notes: adversity computed at decision time from outcome+position+action (M8-2)
  ScenarioLossConstraint:
    fields:
      kind: enum:HARD
      limit: ScenarioLossLimit
      loss_fn: LossFunctional
      scope: ScopeKey
    notes: consumed by DE-Constraints; budget split by DE-Allocator
  IncentiveContract:
    fields:
      payout: PayoutFunctional
      obligations: list[Constraint]
      instrument: InstrumentId
      valid_for: ScopeKey
  PayoutFunctional:
    protocol:
      cash: (ActionOutcome, Known[Uncertain[JointCompetitionState]], InstrumentId) -> Uncertain[Wealth]
    notes: 'M10-4: takes the JOINT wrapper plus an instrument projection, not a scalar'
  IncentiveModel:
    kind: open_protocol
    registry: PluginRegistry
    protocol:
      contract_spec: (InstrumentId) -> Known[IncentiveContract] | Unavailable
      competition_model: () -> ModuleRef
      constraints: () -> list[Constraint]
      cashflow_emitter: () -> PayoutFunctional
    notes: 'M9-4: ONE registration supplies all four contributions; adding a principal-agent/contest theory
      is a plug-in, not a four-file edit'
  PluginRef:
    fields:
      registry: str
      plugin_id: str
      config: JsonSchema
      artifact_id: ImmutableId?
      version: str
  ModuleManifest:
    fields:
      inputs: list[str]
      outputs: list[str]
      ports_required: list[str]
      capabilities_required: list[str]
      stateful: bool
      artifacts: list[ImmutableId]
      null_semantics: dict[str, NullPin]
  UnwrapPolicy:
    fields:
      by_input: dict[str, UnwrapSpec]
  FallbackPolicy:
    fields:
      prior_ref: ImmutableId
      max_age: Duration
      provenance: Provenance
      admissible_when: str
    notes: 'M9-4.3: FALL_BACK needs a referenced prior with an age bound'
  PinnedOutcomes:
    fields:
      model: PluginRef
      spec_hash: Hash
    protocol:
      evaluate: (ActionSet, StateView, SelfState, Duration) -> Uncertain[ActionOutcome] | Unavailable
    notes: 'M10-5: identity lives in PluginRef (single copy); still callable'
  HeartbeatRegistration:
    fields:
      port: TelemetryPortId
      period: Duration
      staleness_deadline: Duration
  HeartbeatPulse:
    fields:
      port: TelemetryPortId
      seq: int
      observed_at: Timestamp
  PortLiveness:
    fields:
      port: TelemetryPortId
      last_seen: Timestamp?
      state: enum:LIVE|STALE|UNKNOWN
    notes: UNKNOWN => fail-closed HALTED; computed from registration + pulses + monitor clock
  StateView:
    methods:
      get: '(field: str) -> Known[any] | Unavailable'
      coverage: '(field: str, span: Duration) -> Coverage'
    notes: the ONLY read entry point; bound to a KnowledgeTime `now`
  Coverage:
    fields:
      segments: list[(Timestamp, Timestamp)]
      complete_frac: float
    notes: 'NOT a scalar: gaps are non-contiguous'
  SelfState:
    fields:
      orders: dict[ImmutableId, OrderRecord]
    methods:
      envelope: '(now: Timestamp) -> ExposureEnvelope'
  OrderRecord:
    fields:
      id: ImmutableId
      token: TokenId
      level: float
      size: float
      t_submitted: Timestamp
      t_acked: Timestamp?
      t_filled: Timestamp?
  ExposureEnvelope:
    fields:
      submitted: float
      acked: float
      filled: float
      in_flight: float
      worst_case_exposure: float
  BeliefProcess:
    fields:
      p_hat: float
      link: LinkFunction
      jump_tail: float | NullPin | Unavailable
      path_law: PathLaw | NullPin | Unavailable
      constituents: dict[str, Constituent]
      staleness: Duration
  Constituent:
    fields:
      value: float
      weight: float
      provenance: Provenance
      t_known: Timestamp
      estimator_uncertainty: float
  LinkFunction:
    fields:
      link_id: ImmutableId
      version: str
    protocol:
      g: (float) -> float
      g_inv: (float) -> float
      g_prime: (float) -> float
      density: (float) -> float
    notes: >-
      never hardcode the Gaussian Phi. M14-1: g_prime/density added because
      every dynamics consumer (participation frontier m/g'(d), lambda_bin, the
      zeta pickoff floor, the hedge delta) needs the derivative, and v13 exposed
      only g and g_inv -- which left those consumers unimplementable except by
      reaching for phi and reintroducing the Gaussian by the back door.
  PathLaw:
    fields:
      instrument: InstrumentId
      unit_space: UnitSpace
      horizon_domain: HorizonDomain
      sampling_convention: SamplingConvention
      anchor: AnchorSpec
      sigma2_rate: VarianceQuantity
      se_log_sigma: float
      nugget: VarianceQuantity | NullPin
      w_declared: Duration
      w_hat_free_diagnostic: Duration | NullPin
      anchor_error_evidence: AnchorErrorEvidence
      calibration: CalibrationCurve | NullPin
      ledger: VarianceGroup
      link_ref: LinkRef
      as_of: Timestamp
      fit_data_through: Timestamp
      target_interval: TargetInterval
      coverage: Coverage
      provenance: Provenance
    protocol:
      settlement_var: '(req: ForecastRequest) -> VarianceQuantity | Unavailable'
      increment_var: '(req: ForecastRequest) -> VarianceQuantity | Unavailable'
      conditional_mean: '(req: ForecastRequest, obs: AnchorObservables) -> Known[float] | Unavailable'
    notes: >-
      M14-1 (ITER2 M2-5). settlement_var is the CONDITIONAL terminal object
      consumers price with; increment_var is the ROLLING object the tape is
      fitted to. They are never interchangeable (ratio 4.1x in sigma at r=10 s)
      and both are exposed so no consumer has to pick. Both take a
      ForecastRequest, not a bare horizon, so as_of, knowledge cutoff and the
      target interval are enforceable rather than implicit; both refuse outside
      horizon_domain. conditional_mean is now part of the carrier because the
      anchor has a state-dependent conditional bias that belongs in the MEAN and
      must not be reachable only through the variance. w_hat_free_diagnostic
      never enters any kernel. See R-WFWD for the fit-cutoff invariant: v13's
      note said the law refuses AFTER fit_data_through, which is backwards -- a
      walk-forward forecast is used precisely then.
  ForecastRequest:
    fields:
      instrument: InstrumentId
      as_of: Timestamp
      knowledge_cutoff: Timestamp
      target_interval: TargetInterval
      horizon: Duration
    notes: >-
      M14-1. The typed request the protocol needs to enforce R-KNOW and R-WFWD.
      A bare `r` cannot express which knowledge set the answer is conditioned on,
      which is exactly how a look-ahead enters unnoticed.
  TargetInterval:
    fields:
      start: Timestamp
      end: Timestamp
  LinkRef:
    fields:
      link_id: ImmutableId
      version: str
    notes: >-
      M14-1. PathLaw REFERENCES the selected link, it does not carry a copy.
      v13 duplicated BeliefProcess.link into PathLaw with no equality invariant
      tying the two, so two consumers could silently disagree about g. The link
      is owned by the belief/spec plane; BE-Uncertainty neither owns nor selects
      it.
  VarianceQuantity:
    fields:
      value: float
      unit_space: UnitSpace
      scale_exponent: int
      component: VarianceComponent
    notes: >-
      M14-1. A variance may not cross the module boundary as a bare float.
      scale_exponent is 2 for a variance and 1 for a standard deviation;
      composing two VarianceQuantity with different unit_space or exponent is a
      type error.
  SamplingConvention:
    fields:
      id: str
      status: enum:UNVERIFIED|VERIFIED|REFUTED
      weights_fast: list[float]
      weights_slow: list[float]
      dt: Duration
      w_declared: Duration
      fast_slow_synchronous: bool
      provenance: Provenance
    notes: >-
      M14-1 (ITER2 M2-2). The averaging kernel is a VERSIONED WEIGHT SCHEDULE,
      never module constants. A ~1 Hz publication cadence is a cadence, not a
      kernel: it does not establish 60 equally-weighted samples, synchronous
      S30/S60 support or right-alignment at t. EXP-M6 proves the published S60
      endpoint reproduces settlement; it says nothing about how that endpoint is
      built. No PathLaw whose sampling_convention.status is UNVERIFIED may be
      used as a pricing input -- a 1 s shift in fast-stream support alone moves
      the anchor coefficient.
  AnchorSpec:
    fields:
      family: enum:TRANSLATION_INVARIANT_TWO_STREAM|OTHER
      alpha: float
      alpha_provenance: enum:ESTIMATED|MODEL_IMPLIED|ASSUMED
      alpha_star_model: float | NullPin
      bias_coeff: float
      bias_enters: enum:MEAN_MODEL|REFUSED
      cond_var: VarianceQuantity
      uncond_mse: VarianceQuantity | NullPin
    notes: >-
      M14-1 (ITER2 M2-1) -- the load-bearing repair. For the family
      P_hat(alpha) = S_slow + alpha*(S_fast - S_slow), the error splits as
      (alpha - alpha*)*(S_fast - S_slow) + a conditionally zero-mean residual.
      The first term is a CONDITIONAL BIAS that is KNOWN AT DECISION TIME, so it
      belongs in the mean model; bias_enters may therefore never be anything but
      MEAN_MODEL or REFUSED. v13 entered the whole unconditional MSE as a
      zero-mean variance line: at BTC's sigma that buried a bias of sd 1.22 bps
      inside a total sigma_eff(30) of ~2.4 bps, i.e. half the standard deviation
      at r=30 was a predictable mean error -- the same defect class as the
      original S60-anchor bug. cond_var is alpha-INDEPENDENT (P_hat is a
      function of the conditioning variables) and is the only line that may
      enter the variance. alpha is a free parameter: alpha_provenance must read
      ESTIMATED before pricing; MODEL_IMPLIED records what a declared path model
      says (alpha* = 2700/1801 under disc1s_v0) and ASSUMED is what v1 did when
      it took alpha = 2 from a local-linear-trend argument that contradicts the
      variance model.
  AnchorObservables:
    fields:
      s_fast: Known[float]
      s_slow: Known[float]
      unit_space: UnitSpace
    notes: >-
      The two stream reads the anchor is a function of. Typed so that the
      conditional bias, which is a function of (s_fast - s_slow), is computable
      by the consumer rather than assumed away.
  AnchorErrorEvidence:
    fields:
      entries: list[AnchorErrorDatum]
      ordered: bool
      feed_error_cov: FeedErrorCov | NullPin
    notes: >-
      M14-1 (ITER2 M2-3). Replaces AnchorErrorBudget{floor, ceiling}, which was
      NOT an ordered bracket. The model-implied MSE of one chosen extrapolator
      is not a distribution-free lower bound -- the conditional projection beats
      it inside the very same model -- and the stream-versus-proxy residual is a
      mixture of anchor error, time-varying basis and proxy error whose
      covariance can move it either way. `ordered` must stay false until an
      ordering is derived from stated assumptions; consumers may not apply
      min/max semantics while it is false.
  AnchorErrorDatum:
    fields:
      label: str
      value: VarianceQuantity
      assumptions: str
      is_a_bound: bool
  FeedErrorCov:
    fields:
      var_fast: float
      var_slow: float
      cov: float
      unit_space: UnitSpace
    notes: >-
      M14-1. Stream measurement error is a 2x2, not a scalar. Its contribution
      is u^T Cov u with u = (alpha, 1 - alpha), so it varies with the horizon
      weights and is generally NOT a scalar multiple of the model curve -- and
      because (1 - alpha) changes sign above alpha = 1, the same covariance
      raises one anchor's variance and lowers another's. v13's scalar
      omega_scale could not express that.
  Interval:
    fields:
      lo: float
      hi: float
  UnitSpace:
    fields:
      coordinate: enum:NORMALISED_ARITHMETIC_RETURN|LOG_RETURN|RAW_PRICE
      reference: enum:STRIKE|WINDOW_OPEN|NONE
      scale: enum:BPS|FRACTION|NATIVE
    notes: >-
      S1. Every variance field is typed by one of these; composing across two
      different UnitSpaces is a type error, and cross-symbol pooling is refused
      before normalisation. The estimator declares
      NORMALISED_ARITHMETIC_RETURN/STRIKE/BPS: the settlement mark is an
      ARITHMETIC mean, so the TWAP kernel and the anchor decomposition are exact
      in price space and only approximate in log space.
  HorizonDomain:
    fields:
      r_min: Duration
      r_max: Duration
      grid: list[Duration]
      basis_crossover: Duration | NullPin | Unavailable
    notes: >-
      Below basis_crossover the basis noise exceeds settlement vol and the price
      model is noise regardless of estimator quality; queries there return
      Unavailable, not a number. M14-1: the basis study is deferred to PM-E1, so
      the field must be able to say so -- v13 typed it as a required Duration,
      which forced a number nobody had measured.
  CalibrationCurve:
    fields:
      c_by_horizon: dict[str, float]
      interval_by_horizon: dict[str, Interval]
      band: Interval
      inference_rule: enum:DAY_BLOCK_BOOTSTRAP|BLOCK_BOOTSTRAP|NONE
      n_day_clusters: int
      status: enum:DIAGNOSTIC|GATE
    notes: >-
      S6. c(r) is the residual AFTER the ledger, never a substitute for it.
      status stays DIAGNOSTIC until n_day_clusters meets the pre-registered
      threshold; a point estimate crossing band at 2 day clusters is not a
      go/no-go. Whether c multiplies the diffusion line or the whole ledger is
      fixed by estimand, not left to the reader.
  ActionSpace:
    fields:
      verbs: list[enum:QUOTE|CANCEL|MINT|MERGE|CROSS|WAIT]
      derived_from: VenueCapabilities
  VenueCapabilities:
    fields:
      flags: dict[str, bool]
  ActionSet:
    fields:
      actions: list[Action]
  Action:
    fields:
      verb: str
      token: TokenId?
      level: float?
      size: float?
  PortfolioState:
    fields:
      positions: dict[TokenId, Position]
      capital: float
  Position:
    fields:
      q_up: float
      q_down: float
      cost_basis: float
  ConstraintSet:
    methods:
      feasible: (ActionSet, PortfolioState) -> FeasibleSet
    notes: 'an ORACLE: feasibility is conditional on the candidate action set'
    fields:
      members: list[Constraint | ScenarioLossConstraint]
  FeasibleSet:
    fields:
      max_size: dict[str, float]
      binding: list[Constraint]
  Constraint:
    fields:
      id: str
      kind: enum:HARD|SOFT
      limit_or_predicate: str
      scope: ScopeKey
      unit: str
      dual_unit: str
      usage: str
      binding_id: str
      provenance: Provenance
  Decision:
    fields:
      actions: ActionSet
      duals: dict[str, float]
      rationale: str
  ActionOutcome:
    fields:
      fills: list[Fill]
      state_transition: str
      cash_flows: dict[str, float]
      latency_used: Duration
      markout_partition: MarkoutPartition
      provenance: Provenance
  Fill:
    fields:
      token: TokenId
      price: float
      size: float
      t: Timestamp
  MarkoutPartition:
    fields:
      spread: float
      transient_AS: float
      permanent_AS: float
      snipe: float
      own_impact: float
      markout: float
    notes: components sum EXACTLY to markout
  CouplingGraph:
    fields:
      nodes: dict[NodeId, str]
      hyperedges: dict[EdgeId, Hyperedge]
      version: str
      provenance: Provenance
      update_semantics: enum:STATIC|PER_DECISION
  Hyperedge:
    fields:
      nodes: list[NodeId]
      relation: enum:ATOMIC|SHARED_RISK|SEQUENTIAL
      params: dict[str, str]
  SpecRecord:
    fields:
      hash: Hash
      observed_at: Timestamp
      source: SourceId
      valid_from: Timestamp
      valid_to: Timestamp
      fields: dict[str, FieldState]
  FieldState:
    variants:
    - Resolved(value, source, provenance)
    - Disputed(candidates, observed_at)
    - Unknown(reason, sources_tried)
  ModuleRef:
    fields:
      module: ModuleId
  RawEvent:
    fields:
      recv_ns: Timestamp
      source: SourceId
      payload: str
  WealthLedger:
    fields:
      markout: float
      fees: float
      rebates: float
      incentives: float
      capital_cost: float
    notes: additive cash in one unit; UtilityFunctional evaluates the terminal distribution
  VarianceComponent:
    fields:
      owner: ModuleId
      unit_space: str
      estimand: str
      support: str
      provenance: Provenance
  VarianceGroup:
    fields:
      components: list[VarianceComponent]
      operator: str
      covariance_model: str
      estimand: str
      validation_gate: str
  CouplingMode:
    variants:
    - Static(StaticCouplingRef)
    - Dynamic
  ResolvedCoupling:
    variants:
    - Static(StaticCouplingRef)
    - Dynamic(Known[CouplingGraph])
  OutcomeModel:
    protocol:
      evaluate: (ActionSet, StateView, SelfState, Duration) -> Uncertain[ActionOutcome] | Unavailable
    registry: PluginRegistry
  UnwrapSpec:
    variants:
    - Expectation
    - 'Quantile(level: float)'
    - 'Draws(n: int, dependence: Dependence)'
  UnavailablePolicy:
    fields:
      by_input: dict[str, UnavailableAction]
  UnavailableAction:
    variants:
    - Halt
    - RefuseAction
    - FallBack(FallbackPolicy)
  ConfirmationSource:
    variants:
    - VenueAck
    - OpenOrderReconciliation
  Money:
    fields:
      amount: float
      currency: str
  CapitalBudget:
    fields:
      by_instrument: dict[InstrumentId, Money]
  SettlementFacts:
    fields:
      resolutions: dict[InstrumentId, VenueOutcome]
      redemption_delay: Duration
modules:
  BE-Uncertainty:
    consumes:
    - ForecastRequest
    produces: dict[InstrumentId, Known[Uncertain[PathLaw]] | Unavailable]
    ports:
    - state_view
    - artifact_resolver
    - telemetry_out
    notes: >-
      M14-1. Fits the physical-volatility law from the TAPE; outcomes are used
      only for calibration and falsification, never to fit it. Emits a law, not
      a scalar. Instrument-scoped and per-symbol: the measured level spans 4.6x
      across coins, so a pooled sigma is a 4.6x error, and any pooling appears
      as a declared shrinkage weight, never as a parameter tie. Reads ONLY
      through the state_view port (R-PORT/R-KNOW) -- v13 declared
      `consumes: RawEvent`, which reached past the DA/StateView knowledge-time
      seam into the landing zone and would have let un-truncated data into a
      walk-forward fit. Refuses (Unavailable) rather than extrapolating outside
      horizon_domain, when sampling_convention.status is UNVERIFIED, or when its
      own inputs are unavailable -- in particular the belief fallback may NOT
      inherit a book-sourced d after the book has failed.
  BE-Competition:
    produces: dict[InstrumentId, Known[Uncertain[CompetitionState]] | Unavailable]
    notes: instrument-scoped marginals
  BE-CompetitionAggregator:
    consumes:
    - BE-Competition
    - CouplingGraph
    produces: Known[Uncertain[JointCompetitionState]] | Unavailable
    requires:
      dependence: Dependence
    notes: combines marginals under an EXPLICIT dependence contract; refuses if unknown
  BE-ScenarioProvider:
    produces: Known[JointOutcomeDistribution] | Unavailable
  DE-Constraints:
    consumes:
    - DecisionProblem
    - HaltState
    - ScenarioLossConstraint
    produces:
    - FeasibleSet
    ports:
    - state_view
    - halt_in
  DE-Actuator:
    consumes:
    - Decision
    - CancelAllCommand
    produces:
    - CancelAllStatus
    ports:
    - venue
    - halt_in
    - cancel_cmd_in
    - telemetry_out
  OP-Monitor:
    consumes:
    - HealthEvent
    - HeartbeatRegistration
    - HeartbeatPulse
    produces:
    - HaltState
    - CancelAllCommand
    notes: 'M9-5: OP produces BOTH state and command; v9 had no producer for the command'
  DA-Feeds:
    produces:
    - RawEvent
    - HeartbeatPulse
    ports:
    - feed
    - telemetry_out
  DE-Allocator:
    consumes:
    - PortfolioState
    - ScenarioLossConstraint
    - SettlementFacts
    produces:
    - CapitalBudget
    ports:
    - state_view
  DA-Settlement:
    produces:
    - SettlementFacts
    ports:
    - feed
ports:
  BE-*:
  - state_view
  - rng
  - artifact_resolver
  - telemetry_out
  DE-*:
  - state_view
  - rng
  - artifact_resolver
  - telemetry_out
  DE-Constraints:
  - halt_in
  DE-Actuator:
  - venue
  - halt_in
  - cancel_cmd_in
  - telemetry_out
  OP-Monitor:
  - telemetry_in
  - heartbeat_in
  - halt_out
  - cancel_cmd_out
  - clock
  EV-*:
  - read_all
  _representation: module records own ports; this map holds only wildcard defaults
