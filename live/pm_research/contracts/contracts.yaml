      from: EventTime
      to: EventTime
      cause: enum:STREAM_GAP|COLLECTOR_RESTART|VENUE_SLOW_CONSUMER_1013|VENUE_SERVER_CYCLE|TOPIC_STALE|GLOBAL_SOCKET_SILENCE|NOT_YET_SUBSCRIBED|POST_UNSUBSCRIBE|UNKNOWN
      raw_cause: str
      evidence: str
  Coverage:
    fields:
      field: str
      target: (EventTime, EventTime)
      covered: list[(EventTime, EventTime)]
      gaps: list[Gap]
      weight_missing: float
      tail_deficit: Duration
      observed_n: int
      expected_n: int
      duplicate_n: int
      max_gap: Duration
      complete_frac: float
      strike_readable: bool
      provenance: Provenance
    notes: 'NOT a scalar: gaps are non-contiguous'
  AdmissibilityRule:
    fields:
      id: AdmissibilityRuleId
      version: int
      status: enum:DRAFT|FROZEN|RETIRED
      field: str
      target_expr: str
      cadence: Duration
      min_complete_frac: float?
      max_weight_missing: float?
      max_gap: Duration?
      protected_span_expr: str?
      require_pre_boundary_sample: bool
      require_known_at_boundary: bool
