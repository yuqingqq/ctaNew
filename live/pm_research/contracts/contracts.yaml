      required_gap_arm: enum:EXCLUDE|INDICATOR|BOTH
      frozen_at: Timestamp?
      spec_hash: Hash
  AdmissibilityDecision:
    fields:
      coverage_hash: Hash
      rule: AdmissibilityRuleId
      rule_hash: Hash
      admissible: bool
      failed_checks: list[str]
      evaluated_at: Timestamp
  RefusalLedger:
    fields:
      by_field: dict[str, RefusalCount]
  RefusalCount:
    fields:
      n_admitted: int
      n_refused_within_err: int
      n_unavailable_upstream: int
      worst_case_peek_blocked: Duration
  SelfState:
    fields:
      orders: dict[ImmutableId, OrderRecord]
    methods:
      envelope: '(now: Timestamp) -> ExposureEnvelope'
  OrderRecord:
    fields:
      id: ImmutableId
      token: TokenId
      level: float
      size: float
      t_submitted: Timestamp
      t_acked: Timestamp?
      t_filled: Timestamp?
  ExposureEnvelope:
    fields:
      submitted: float
      acked: float
      filled: float
      in_flight: float
      worst_case_exposure: float
  BeliefProcess:
    fields:
      p_hat: float
      link: LinkFunction
      jump_tail: float | NullPin | Unavailable
      path_law: PathLaw | NullPin | Unavailable
      constituents: dict[str, Constituent]
      staleness: Duration
  Constituent:
    fields:
      value: float
      weight: float
      provenance: Provenance
      t_known: Timestamp
      estimator_uncertainty: float
  LinkFunction:
    fields:
      link_id: ImmutableId
      version: str
    protocol:
      g: (float) -> float
      g_inv: (float) -> float
      g_prime: (float) -> float
    notes: 'never hardcode the Gaussian Phi. M14-1: g_prime added because every dynamics consumer
      (participation frontier m/g''(d), lambda_bin, the zeta pickoff floor, the hedge delta)
      needs the derivative, and v13 exposed only g and g_inv -- which left those consumers
      unimplementable except by reaching for phi and reintroducing the Gaussian by the back
      door. M15-1 (ITER3 M3-5): g_prime is the SINGLE canonical derivative. v14 also carried
      `density`, which for a CDF-valued link is the same function under a second name and
      let two implementations disagree with no equality rule.'
  PathLaw:
    variants:
    - 'ReducedForm(law: ReducedFormPathLaw)'
    - 'Structural(diag: StructuralDiagnosticLaw)'
    notes: M16-1 (ITER4 M4-6). A REAL discriminated union. v15 made estimand_route an enum
      on a single record that always carried BOTH reduced-form and structural fields, so a
      route-A object was forced to populate an anchor, a rate and a sampling convention it
      does not use, while a structural object kept the pricing-shaped protocol. Only the ReducedForm
      arm answers a pricing query; the Structural arm has no settlement_var at all, so a pricing
      consumer cannot bind to it even by mistake. This is the type-level encoding of R-ROUTE,
      replacing a key-name convention.
  ReducedFormPathLaw:
    fields:
      instrument: InstrumentId
      unit_space: UnitSpace
      stream_provenance: StreamProvenance
      by_horizon: dict[str, ReducedFormFit]
      link_ref: LinkRef
      as_of: Timestamp
      fit_data_through: Timestamp
      target_interval: TargetInterval
      coverage: Coverage
      status: enum:FITTED|UNFITTED|REFUSED
      provenance: Provenance
    protocol:
      pricing_distribution: '(req: ForecastRequest, obs: AnchorObservables) -> Distribution
        | Unavailable'
    notes: 'M16-1. THE PRICING CARRIER, and the only one. Note what is ABSENT: no SamplingConvention
      (M4-1 -- route A regresses the PUBLISHED streams and never needs their internal kernel;
      v15 gated it on VERIFIED anyway, which destroyed the operational advantage that selected
      route A), no sigma2_rate, no AnchorSpec, no k_law. Note also there is NO settlement_var:
      terminal variance is reachable ONLY through pricing_distribution, which validates the
      request BEFORE computing either moment and returns mean and variance from the SAME validated
      fit. v15 exposed pricing_var and conditional_mean separately and neither called the
      request checker, so correctness rested on every future caller remembering an unrelated
      pre-call. increment_var is absent too: the rolling object belongs to the structural
      arm.'
  ReducedFormFit:
    fields:
      alpha: float
      resid_var: VarianceQuantity
      n_effective: int
      n_day_clusters: int
      cross_fitted: bool
      mean_gate: GateEvidence
      var_gate: GateEvidence
    notes: 'M16-1 (M4-3). Evidence lives on EACH (symbol, horizon) fit. v15 stored one cluster
      count and two scalar p-values for a whole horizon map while the plan required per-horizon,
      per-symbol evidence. resid_var must be strictly positive and finite and counts must
      be nonnegative integers: v15 priced resid_var = -1 and accepted NaN counts and NaN p-values,
      because every ordered comparison against NaN is false.'
  GateEvidence:
    fields:
      gate: GateId
      scope: ScopeKey
      coin: str?
      per_fill: Interval | NullPin
      share_weighted: Interval | NullPin
      ci_arm: enum:UPPER|LOWER
      estimand_is_idealised: enum:UPPER|LOWER|NO
      decision_eligible: bool
      admissible: bool
      inadmissible_reason: str?
      provenance_state: ProvenanceState
      inference_actual: str
      evaluated_at: Timestamp
      code_hash: Hash
      status: enum:CURRENT|SUPERSEDED|WITHDRAWN|INVALIDATED
      supersedes: ImmutableId?
      withdrawn_reason: str?
      verdict: VerdictState?
      tolerance: float
      ci_hi_abs: float | Unavailable
      effect_size: float
      test: str
      conditioning: str
      multiplicity: str
      sampling_unit: str | NullPin
      p_value: float | NullPin
    notes: M16-1 (ITER4 M4-4). FAILURE TO REJECT IS NOT EQUIVALENCE. v15 gated pricing on
      p >= 0.01, which treats "not enough data" as "verified" -- backwards at the ten-day-cluster
      minimum where these tests have little power. PASS requires the |effect| confidence bound
      to lie INSIDE a pre-registered tolerance; INSUFFICIENT_EVIDENCE and MODEL_REFUTED are
      distinct states and both refuse. test, conditioning basis and multiplicity policy must
      be pre-registered, not chosen after seeing the data. Ten day clusters is a minimum for
      ATTEMPTING inference, never evidence of validity.
  StreamProvenance:
    fields:
      fast_id: FeedId
      slow_id: FeedId
      unit_space: UnitSpace
      point_in_time: bool
      aligned_at_publication: bool
      status: enum:VERIFIED|UNVERIFIED
    notes: 'M16-1 (M4-1). What route A actually requires: stream identities, reads that are
      point-in-time at knowledge time, declared units, and alignment at the PUBLISHED timestamps.
      A different provenance question from SamplingConvention, which describes the venue''s
      internal aggregation and gates the structural arm only. Conflating the two wrongly gated
      route A.'
  Distribution:
    fields:
      mean: float
      var: VarianceQuantity
      horizon: Duration
      instrument: InstrumentId
      as_of: Timestamp
      provenance: StreamProvenance
    notes: M16-1. The single typed result of the atomic query. Mean and variance are produced
      together from one validated fit, so they cannot be taken from inconsistent objects or
      versions.
  StructuralDiagnosticLaw:
    fields:
      instrument: InstrumentId
      unit_space: UnitSpace
      sampling_convention: SamplingConvention
      anchor: AnchorSpec
      sigma2_rate: RateQuantity
      nugget: VarianceQuantity | NullPin
      w_declared: Duration
      w_hat_free_diagnostic: Duration | NullPin
      anchor_error_evidence: AnchorErrorEvidence
      calibration: CalibrationCurve | NullPin
      ledger: VarianceGroup
      as_of: Timestamp
      fit_data_through: Timestamp
      coverage: Coverage
      provenance: Provenance
    protocol:
      decomposition: '(r: Duration) -> DiagnosticVarianceDecomposition | Unavailable'
      increment_var: '(h: Duration) -> VarianceQuantity | Unavailable'
    notes: 'M16-1. DIAGNOSTICS ONLY, and structurally incapable of pricing: no settlement_var
      and no pricing_distribution, so no probability consumer can bind to it. It owns increment_var,
      the ROLLING object the tape is fitted to, never interchangeable with a terminal conditional
      variance (ratio 4.1x in sigma at r=10 s). Gated on sampling_convention.status == VERIFIED
      -- that gate belongs HERE and nowhere else.'
  DiagnosticVarianceDecomposition:
    fields:
      r: Duration
      diffusion: VarianceQuantity
      cond_var_at_model: VarianceQuantity
      feed: VarianceQuantity
      model_total: VarianceQuantity
      alpha_star: float
      selected_alpha: float
      selected_bias_coeff: float
      selected_uncond_mse: VarianceQuantity
    notes: 'M16-1 (ITER4 M4-5). cond_var_at_model is computed ONLY at the model projection
      and is therefore independent of the selected anchor. v15 passed the selected (possibly
      empirical) alpha into the conditional-variance function, which returns conditional variance
      PLUS squared bias whenever alpha differs from alpha*, and published that as `anchor_var`
      -- so changing the empirical alpha silently changed the alleged conditional variance.
      That is the variance/MSE conflation Revision 3 removed, reintroduced on the diagnostic
      route. The selected anchor''s known bias and unconditional MSE are now SEPARATE fields.
      model_total is a model quantity and cannot be read as a settlement variance: the type
      carries no pricing protocol, which is a boundary a key-name convention was not.'
  KernelCoefficient:
    fields:
      value: float
      units: enum:SECONDS
    notes: 'M16-1 (M4-6). k_law and the conditional-variance coefficient are NOT dimensionless:
      rate[bps^2/second] * coefficient = bps^2 requires SECONDS, and the plan''s own seam
      value is labelled 20.5028 s. v15 called them dimensionless while multiplying a rate
      by them.'
  ForecastRequest:
    fields:
      instrument: InstrumentId
      as_of: Timestamp
      knowledge_cutoff: Timestamp
      target_interval: TargetInterval
      horizon: Duration
      link_ref: LinkRef
    notes: M14-1. The typed request the protocol needs to enforce R-KNOW and R-WFWD. A bare
      `r` cannot express which knowledge set the answer is conditioned on, which is exactly
      how a look-ahead enters unnoticed.
  TargetInterval:
    fields:
      start: Timestamp
      end: Timestamp
  LinkRef:
    fields:
      link_id: ImmutableId
      version: str
    notes: M14-1. PathLaw REFERENCES the selected link, it does not carry a copy. v13 duplicated
      BeliefProcess.link into PathLaw with no equality invariant tying the two, so two consumers
      could silently disagree about g. The link is owned by the belief/spec plane; BE-Uncertainty
      neither owns nor selects it.
  VarianceQuantity:
    fields:
      value: float
      unit_space: UnitSpace
      scale_exponent: int
      component: VarianceComponent
    notes: M14-1. A variance may not cross the module boundary as a bare float. scale_exponent
      is 2 for a variance and 1 for a standard deviation; composing two VarianceQuantity with
      different unit_space or exponent is a type error.
  SamplingConvention:
    fields:
      id: str
      status: enum:UNVERIFIED|VERIFIED|REFUTED
      schedule_fast: list[WeightAtOffset]
      schedule_slow: list[WeightAtOffset]
      alignment: str
      update_semantics: str
      dt: Duration
      w_declared: Duration
      provenance: Provenance
    notes: 'M14-1 (ITER2 M2-2). The averaging kernel is a VERSIONED WEIGHT SCHEDULE, never
      module constants. A ~1 Hz publication cadence is a cadence, not a kernel: it does not
      establish 60 equally-weighted samples, synchronous S30/S60 support or right-alignment
      at t. EXP-M6 proves the published S60 endpoint reproduces settlement; it says nothing
      about how that endpoint is built. No PathLaw whose sampling_convention.status is UNVERIFIED
      may be used as a pricing input -- a 1 s shift in fast-stream support alone moves the
      anchor coefficient.'
  AnchorSpec:
    fields:
      family: enum:TRANSLATION_INVARIANT_TWO_STREAM|OTHER
      selected: enum:MODEL|ESTIMATED
      alpha_model_by_horizon: dict[str, float]
      alpha_estimated_by_horizon: dict[str, float] | NullPin
      bias_coeff_by_horizon: dict[str, float]
      bias_enters: enum:MEAN_MODEL|REFUSED
      model_gap_by_horizon: dict[str, float] | NullPin
      cond_var_by_horizon: dict[str, VarianceQuantity]
    notes: 'M16-1. For P_hat(alpha) = S_slow + alpha*(S_fast - S_slow) the error splits as
      (alpha - alpha_selected)*(S_fast - S_slow) + a conditionally zero-mean residual. The
      first term is KNOWN AT DECISION TIME and belongs in the mean; bias_enters may never
      be other than MEAN_MODEL or REFUSED. v14 defined bias against the MODEL coefficient
      unconditionally, so an empirically fitted alpha was always labelled biased and the documented
      mean correction dragged the centre back to the Brownian projection -- no empirical coefficient
      could become the zero-bias mean. `selected` now says which estimand defines correctness
      and bias is measured against THAT, so a fitted conditional mean is unbiased with respect
      to itself. model_gap_by_horizon (estimated - model) survives as a PROCESS DIAGNOSTIC
      and is never applied as a correction. Every quantity is HORIZON-INDEXED: the anchor
      is not a scalar (alpha* is 1.2496 at r=30 against 1.4992 outside the window) and the
      plan fits it at each r.'
  AnchorObservables:
    fields:
      s_fast: Known[float]
      s_slow: Known[float]
      unit_space: UnitSpace
    notes: The two stream reads the anchor is a function of. Typed so that the conditional
      bias, which is a function of (s_fast - s_slow), is computable by the consumer rather
      than assumed away.
  AnchorErrorEvidence:
    fields:
      entries: list[AnchorErrorDatum]
      ordered: bool
      feed_error_cov: FeedErrorCov | NullPin
    notes: M14-1 (ITER2 M2-3). Replaces AnchorErrorBudget{floor, ceiling}, which was NOT an
      ordered bracket. The model-implied MSE of one chosen extrapolator is not a distribution-free
      lower bound -- the conditional projection beats it inside the very same model -- and
      the stream-versus-proxy residual is a mixture of anchor error, time-varying basis and
      proxy error whose covariance can move it either way. `ordered` must stay false until
      an ordering is derived from stated assumptions; consumers may not apply min/max semantics
      while it is false.
  AnchorErrorDatum:
    fields:
      label: str
      value: VarianceQuantity
      assumptions: str
      is_a_bound: bool
  FeedErrorCov:
    fields:
      var_fast: float
      var_slow: float
      cov: float
      unit_space: UnitSpace
      units: enum:BPS_SQUARED
      psd_validated: bool
      identification: enum:CROSS_VARIOGRAM_NUGGET|EXTERNAL_INSTRUMENT|INSIDE_REDUCED_FORM_RESIDUAL|NONE
    notes: 'M16-1. Stream measurement error is a 2x2, not a scalar: the contribution is u^T
      Cov u with u = (alpha, 1 - alpha), so it varies with the horizon weights, and because
      (1 - alpha) changes sign above alpha = 1 the same covariance raises one anchor''s variance
      and lowers another''s. UNITS ARE BPS_SQUARED, once, everywhere. v14 typed this in bps^2
      while the fixture documented sigma^2 units and multiplied by the rate, so an identity
      matrix at rate 4 contributed 9.9867 instead of 2.4967. psd_validated must be true before
      use -- a non-PSD matrix drove total variance to -120.9. IDENTIFICATION is not free:
      contemporaneous moments give 3 numbers for 4 unknowns (rate plus this 2x2), so Omega
      is NOT identified from them. Under the STRUCTURAL route it is the lag-0 discontinuity
      of the bivariate cross-variogram -- i.e. the NUGGET -- which requires the sampling convention
      to be VERIFIED first and is entangled with w_hat_free (a variogram fitted without a
      nugget attributes microstructure to a shorter kernel). Under the REDUCED_FORM route
      it is INSIDE the residual and must never be added again.'
  WeightAtOffset:
    fields:
      relative_offset: Duration
      weight: float
    notes: 'M16-1 (M4-6). A weight schedule needs SUPPORT, not just magnitudes. v15''s list[float]
      could not encode where each sample sits or which stream is offset, so an aligned schedule
      and a one-second-lagged one carried identical weight lists, and `fast_slow_synchronous:
      false` did not say which stream lagged or by how much.'
  Interval:
    fields:
      lo: float
      hi: float
  RateQuantity:
    fields:
      value: float
      unit_space: UnitSpace
      per: enum:SECOND
    notes: M16-1. A variance RATE is bps^2 per second and is not the same type as a terminal
      bps^2 variance. v14 typed sigma2_rate as VarianceQuantity, which erased the time dimension
      and made a rate and a terminal variance interchangeable at the boundary.
  ReducedFormLaw:
    fields:
      by_horizon: dict[str, ReducedFormFit]
      convention: SamplingConvention
      n_day_clusters: int
      cross_fitted: bool
      resid_cond_mean_test_p: float
      hetero_test_p: float
      status: enum:FITTED|UNFITTED|REFUSED
    notes: 'M16-1. Superseded as a top-level carrier by ReducedFormPathLaw; retained as the
      per-symbol fitted-law record. THE PRICING LAW. Its residual variance is the WHOLE of
      Sigma(r) -- future innovation, latent-path uncertainty, stream error and every covariance
      among them are already inside it. The structural lines (k_law, anchor cond_var, FeedErrorCov)
      are NEVER added to it; doing so double-counts. OLS yields the best LINEAR PROJECTION
      and a POOLED residual, which is the conditional mean only if that mean is linear and
      the conditional variance only under homoskedasticity -- otherwise it is an unconditional
      forecast MSE, the same category error this programme removed from the Brownian variance
      line one revision earlier. Hence resid_cond_mean_test_p, hetero_test_p, cross_fitted
      and n_day_clusters are GATES: pricing refuses without them.'
  UnitSpace:
    fields:
      coordinate: enum:NORMALISED_ARITHMETIC_RETURN|LOG_RETURN|RAW_PRICE
      reference: enum:STRIKE|WINDOW_OPEN|NONE
      scale: enum:BPS|FRACTION|NATIVE
    notes: 'S1. Every variance field is typed by one of these; composing across two different
      UnitSpaces is a type error, and cross-symbol pooling is refused before normalisation.
      The estimator declares NORMALISED_ARITHMETIC_RETURN/STRIKE/BPS: the settlement mark
      is an ARITHMETIC mean, so the TWAP kernel and the anchor decomposition are exact in
      price space and only approximate in log space.'
  HorizonDomain:
    fields:
      r_min: Duration
      r_max: Duration
      grid: list[Duration]
      basis_crossover: Duration | NullPin | Unavailable
    notes: 'Below basis_crossover the basis noise exceeds settlement vol and the price model
      is noise regardless of estimator quality; queries there return Unavailable, not a number.
      M14-1: the basis study is deferred to PM-E1, so the field must be able to say so --
      v13 typed it as a required Duration, which forced a number nobody had measured.'
  CalibrationCurve:
    fields:
      c_by_horizon: dict[str, float]
      interval_by_horizon: dict[str, Interval]
      band: Interval
      inference_rule: enum:DAY_BLOCK_BOOTSTRAP|BLOCK_BOOTSTRAP|NONE
      n_day_clusters: int
      status: enum:DIAGNOSTIC|GATE
    notes: M16-1 (ITER4 M4-6). c(r) is the AGREEMENT RATIO between the two routes, c(r) =
      Sigma_A(r) / model_total_B(r), expected near 1. It is added to NEITHER route and multiplies
      neither line. v13-v15 described it as "the residual AFTER the ledger" and asked whether
      it multiplied one line or the whole ledger; both readings predate the route split and
      are withdrawn. A c(r) far from 1 is evidence the parametric law misdescribes the tape,
      i.e. information about route B, never a correction to route A. status stays DIAGNOSTIC
      until n_day_clusters meets the pre-registered threshold.
  ActionSpace:
    fields:
      verbs: list[enum:QUOTE|CANCEL|MINT|MERGE|CROSS|WAIT]
      derived_from: VenueCapabilities
  VenueCapabilities:
    fields:
      flags: dict[str, bool]
  ActionSet:
    fields:
      actions: list[Action]
  Action:
    fields:
      verb: str
      token: TokenId?
      level: float?
      size: float?
      order_ref: str?
      placement: enum:JOIN|FRONT_ON_FORMATION
  PortfolioState:
    fields:
      positions: dict[TokenId, Position]
      capital: float
  Position:
    fields:
      q_up: float
      q_down: float
      cost_basis: float
  ConstraintSet:
    methods:
      feasible: (ActionSet, PortfolioState) -> FeasibleSet
    notes: 'an ORACLE: feasibility is conditional on the candidate action set'
    fields:
      members: list[Constraint | ScenarioLossConstraint]
  FeasibleSet:
    fields:
      max_size: dict[str, float]
      binding: list[Constraint]
    notes: ' max_size keys are side-keyed "VERB:SIDE" (key domain pinned); DEFAULT-DENY: a
      verb:side absent from the dict is INFEASIBLE — without the pin an empty set is permissive
      and the halt door inverts (module plan §2a).'
  Constraint:
    fields:
      id: str
      kind: enum:HARD|SOFT
      limit_or_predicate: str
      scope: ScopeKey
      unit: str
      dual_unit: str
      usage: str
      binding_id: str
      provenance: Provenance
  Decision:
    fields:
      actions: ActionSet
      duals: dict[str, float]
      rationale: str
  ActionOutcome:
    fields:
      fills: list[Fill]
      state_transition: str
      cash_flows: dict[str, float]
      latency_used: Duration
      adverse_move: list[AdverseMoveEstimate]
      markout_partition: MarkoutPartition
