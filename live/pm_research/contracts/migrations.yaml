- from_version: 13
  to_version: 14
  operation: change
  key: note:PathLaw
  old: 'M13-1. Replaces {kind: str, params: dict[str, float]}, which could not carry a unit space, a horizon
    domain, a fit cutoff or a refusal, so an estimator emitting a LAW rather than a scalar had no typed
    carrier. settlement_var is the CONDITIONAL terminal object consumers price with; increment_var is
    the ROLLING object the tape is fitted to. They are never interchangeable (ratio 4.1x in sigma at r=10
    s) and both are exposed so no consumer has to pick. Both REFUSE outside horizon_domain and after fit_data_through
    rather than extrapolating. w_hat_free_diagnostic never enters either kernel.'
  new: 'M14-1 (ITER2 M2-5). settlement_var is the CONDITIONAL terminal object consumers price with; increment_var
    is the ROLLING object the tape is fitted to. They are never interchangeable (ratio 4.1x in sigma at
    r=10 s) and both are exposed so no consumer has to pick. Both take a ForecastRequest, not a bare horizon,
    so as_of, knowledge cutoff and the target interval are enforceable rather than implicit; both refuse
    outside horizon_domain. conditional_mean is now part of the carrier because the anchor has a state-dependent
    conditional bias that belongs in the MEAN and must not be reachable only through the variance. w_hat_free_diagnostic
    never enters any kernel. See R-WFWD for the fit-cutoff invariant: v13''s note said the law refuses
    AFTER fit_data_through, which is backwards -- a walk-forward forecast is used precisely then.'
  reason: 'M14-1 (M2-5.5): the v13 note stated the fit-cutoff refusal backwards and predated the mean/variance
    separation'
