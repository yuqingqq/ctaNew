  old: 'S3. Var(P_hat - P_t) is NOT identified against one proxy: latent spot is unobserved and time-varying
    basis plus proxy error stay in the residual. Carried as a BRACKET. floor is model-implied (the reconstruction
    cost with perfect synchronous feeds, sigma_kernels.omega_p_coeff); ceiling is the empirical proxy
