- from_version: 15
  to_version: 16
  operation: change
  key: note:AnchorSpec
  old: 'M15-1 (ITER3 M3-2). For P_hat(alpha) = S_slow + alpha*(S_fast - S_slow) the error splits as (alpha
    - alpha_selected)*(S_fast - S_slow) + a conditionally zero-mean residual. The first term is KNOWN
    AT DECISION TIME and belongs in the mean; bias_enters may never be other than MEAN_MODEL or REFUSED.
    v14 defined bias against the MODEL coefficient unconditionally, so an empirically fitted alpha was
    always labelled biased and the documented mean correction dragged the centre back to the Brownian
    projection -- no empirical coefficient could become the zero-bias mean. `selected` now says which
    estimand defines correctness and bias is measured against THAT, so a fitted conditional mean is unbiased
    with respect to itself. model_gap_by_horizon (estimated - model) survives as a PROCESS DIAGNOSTIC
    and is never applied as a correction. Every quantity is HORIZON-INDEXED: the anchor is not a scalar
    (alpha* is 1.2496 at r=30 against 1.4992 outside the window) and the plan fits it at each r.'
  new: 'M16-1. For P_hat(alpha) = S_slow + alpha*(S_fast - S_slow) the error splits as (alpha - alpha_selected)*(S_fast
    - S_slow) + a conditionally zero-mean residual. The first term is KNOWN AT DECISION TIME and belongs
    in the mean; bias_enters may never be other than MEAN_MODEL or REFUSED. v14 defined bias against the
    MODEL coefficient unconditionally, so an empirically fitted alpha was always labelled biased and the
    documented mean correction dragged the centre back to the Brownian projection -- no empirical coefficient
    could become the zero-bias mean. `selected` now says which estimand defines correctness and bias is
    measured against THAT, so a fitted conditional mean is unbiased with respect to itself. model_gap_by_horizon
    (estimated - model) survives as a PROCESS DIAGNOSTIC and is never applied as a correction. Every quantity
    is HORIZON-INDEXED: the anchor is not a scalar (alpha* is 1.2496 at r=30 against 1.4992 outside the
    window) and the plan fits it at each r.'
  reason: 'M16-1: renumbered under the ITER4 repair'
- from_version: 15
  to_version: 16
  operation: change
  key: note:CalibrationCurve
  old: S6. c(r) is the residual AFTER the ledger, never a substitute for it. status stays DIAGNOSTIC until
    n_day_clusters meets the pre-registered threshold; a point estimate crossing band at 2 day clusters
    is not a go/no-go. Whether c multiplies the diffusion line or the whole ledger is fixed by estimand,
    not left to the reader.
  new: M16-1 (ITER4 M4-6). c(r) is the AGREEMENT RATIO between the two routes, c(r) = Sigma_A(r) / model_total_B(r),
    expected near 1. It is added to NEITHER route and multiplies neither line. v13-v15 described it as
    "the residual AFTER the ledger" and asked whether it multiplied one line or the whole ledger; both
    readings predate the route split and are withdrawn. A c(r) far from 1 is evidence the parametric law
    misdescribes the tape, i.e. information about route B, never a correction to route A. status stays
    DIAGNOSTIC until n_day_clusters meets the pre-registered threshold.
  reason: 'M16-1 (M4-6): c(r) restated as the route-agreement RATIO, added to neither route'
- from_version: 15
  to_version: 16
  operation: change
  key: note:FeedErrorCov
  old: 'M15-1 (ITER3 M3-3). Stream measurement error is a 2x2, not a scalar: the contribution is u^T Cov
    u with u = (alpha, 1 - alpha), so it varies with the horizon weights, and because (1 - alpha) changes
    sign above alpha = 1 the same covariance raises one anchor''s variance and lowers another''s. UNITS
    ARE BPS_SQUARED, once, everywhere. v14 typed this in bps^2 while the fixture documented sigma^2 units
    and multiplied by the rate, so an identity matrix at rate 4 contributed 9.9867 instead of 2.4967.
    psd_validated must be true before use -- a non-PSD matrix drove total variance to -120.9. IDENTIFICATION
    is not free: contemporaneous moments give 3 numbers for 4 unknowns (rate plus this 2x2), so Omega
    is NOT identified from them. Under the STRUCTURAL route it is the lag-0 discontinuity of the bivariate
    cross-variogram -- i.e. the NUGGET -- which requires the sampling convention to be VERIFIED first
    and is entangled with w_hat_free (a variogram fitted without a nugget attributes microstructure to
    a shorter kernel). Under the REDUCED_FORM route it is INSIDE the residual and must never be added
    again.'
  new: 'M16-1. Stream measurement error is a 2x2, not a scalar: the contribution is u^T Cov u with u =
    (alpha, 1 - alpha), so it varies with the horizon weights, and because (1 - alpha) changes sign above
    alpha = 1 the same covariance raises one anchor''s variance and lowers another''s. UNITS ARE BPS_SQUARED,
    once, everywhere. v14 typed this in bps^2 while the fixture documented sigma^2 units and multiplied
    by the rate, so an identity matrix at rate 4 contributed 9.9867 instead of 2.4967. psd_validated must
    be true before use -- a non-PSD matrix drove total variance to -120.9. IDENTIFICATION is not free:
    contemporaneous moments give 3 numbers for 4 unknowns (rate plus this 2x2), so Omega is NOT identified
    from them. Under the STRUCTURAL route it is the lag-0 discontinuity of the bivariate cross-variogram
    -- i.e. the NUGGET -- which requires the sampling convention to be VERIFIED first and is entangled
    with w_hat_free (a variogram fitted without a nugget attributes microstructure to a shorter kernel).
    Under the REDUCED_FORM route it is INSIDE the residual and must never be added again.'
  reason: 'M16-1: renumbered under the ITER4 repair'
- from_version: 15
  to_version: 16
  operation: change
  key: note:PathLaw
  old: 'M14-1 (ITER2 M2-5). settlement_var is the CONDITIONAL terminal object consumers price with; increment_var
    is the ROLLING object the tape is fitted to. They are never interchangeable (ratio 4.1x in sigma at
    r=10 s) and both are exposed so no consumer has to pick. Both take a ForecastRequest, not a bare horizon,
    so as_of, knowledge cutoff and the target interval are enforceable rather than implicit; both refuse
    outside horizon_domain. conditional_mean is now part of the carrier because the anchor has a state-dependent
    conditional bias that belongs in the MEAN and must not be reachable only through the variance. w_hat_free_diagnostic
    never enters any kernel. See R-WFWD for the fit-cutoff invariant: v13''s note said the law refuses
    AFTER fit_data_through, which is backwards -- a walk-forward forecast is used precisely then.'
  new: M16-1 (ITER4 M4-6). A REAL discriminated union. v15 made estimand_route an enum on a single record
    that always carried BOTH reduced-form and structural fields, so a route-A object was forced to populate
    an anchor, a rate and a sampling convention it does not use, while a structural object kept the pricing-shaped
    protocol. Only the ReducedForm arm answers a pricing query; the Structural arm has no settlement_var
    at all, so a pricing consumer cannot bind to it even by mistake. This is the type-level encoding of
    R-ROUTE, replacing a key-name convention.
  reason: 'M16-1 (M4-6): the note now describes the union rather than a shared record'
- from_version: 15
  to_version: 16
  operation: change
  key: note:RateQuantity
  old: M15-1 (ITER3 M3-3). A variance RATE is bps^2 per second and is not the same type as a terminal
    bps^2 variance. v14 typed sigma2_rate as VarianceQuantity, which erased the time dimension and made
    a rate and a terminal variance interchangeable at the boundary.
  new: M16-1. A variance RATE is bps^2 per second and is not the same type as a terminal bps^2 variance.
    v14 typed sigma2_rate as VarianceQuantity, which erased the time dimension and made a rate and a terminal
    variance interchangeable at the boundary.
  reason: 'M16-1: renumbered under the ITER4 repair'
- from_version: 15
  to_version: 16
  operation: change
  key: note:ReducedFormLaw
  old: 'M15-1 (ITER3 M3-1). THE PRICING LAW. Its residual variance is the WHOLE of Sigma(r) -- future
    innovation, latent-path uncertainty, stream error and every covariance among them are already inside
    it. The structural lines (k_law, anchor cond_var, FeedErrorCov) are NEVER added to it; doing so double-counts.
    OLS yields the best LINEAR PROJECTION and a POOLED residual, which is the conditional mean only if
    that mean is linear and the conditional variance only under homoskedasticity -- otherwise it is an
    unconditional forecast MSE, the same category error this programme removed from the Brownian variance
    line one revision earlier. Hence resid_cond_mean_test_p, hetero_test_p, cross_fitted and n_day_clusters
    are GATES: pricing refuses without them.'
  new: 'M16-1. Superseded as a top-level carrier by ReducedFormPathLaw; retained as the per-symbol fitted-law
    record. THE PRICING LAW. Its residual variance is the WHOLE of Sigma(r) -- future innovation, latent-path
    uncertainty, stream error and every covariance among them are already inside it. The structural lines
    (k_law, anchor cond_var, FeedErrorCov) are NEVER added to it; doing so double-counts. OLS yields the
    best LINEAR PROJECTION and a POOLED residual, which is the conditional mean only if that mean is linear
    and the conditional variance only under homoskedasticity -- otherwise it is an unconditional forecast
    MSE, the same category error this programme removed from the Brownian variance line one revision earlier.
    Hence resid_cond_mean_test_p, hetero_test_p, cross_fitted and n_day_clusters are GATES: pricing refuses
    without them.'
  reason: 'M16-1: demoted from top-level carrier to the per-symbol fitted record'
