protocol: FLOW_MODEL_V3
status: HISTORICAL_SUPERSEDED_BY_V4
governs: false
superseded_by: FLOW_AND_FILLS_V4
supersession_note: >
  Retained for provenance only. V3 and V4 were both FROZEN with overlapping
  scope and no precedence, and they DISAGREE: V3 carries Hawkes history across
  adjacent markets and warms up after gaps, V4 resets each window with no
  warm-up; V3 declares design_data_through 2026-08-21T23:59:59Z against V4's
  07:05:00Z. The code implements V4. The differing cutoffs are the sharp edge --
  08-21 07:05 to 23:59 is design data here and NEITHER design nor evaluation
  under V4, so a V3 fit scored against V4 gates carries an inconsistent embargo.
  Do NOT use this file to admit data or score a fit.
prior_status: FROZEN_FOR_FORWARD_EVALUATION
frozen_at: '2026-08-21T06:16:40Z'
design_data_through: '2026-08-21T23:59:59Z'
primary_evaluation_start: '2026-08-22T00:00:00Z'
research_only: true

universe:
  coins: [btc, eth, sol, xrp, doge, bnb, hype]
  pooling: DIAGNOSTIC_ONLY
  primary_verdict: PER_COIN

state:
  price_state: UP_BOOK_MIDPOINT
  knowledge_lag_ms: 250
  interval: HALF_OPEN
  execution_price_is_mark: true
  gap_policy: KILL_STATE_REQUIRE_NEW_QUOTE
  minimum_price_bin_dwell_s: 60
  price_edges: [0.0, 0.05, 0.15, 0.35, 0.65, 0.85, 0.95, 1.0]
  remaining_time_bands_s:
    BODY: [60, 300]
    TERMINAL: [0, 60]

process:
  arrival_identity: LAST_TRADE_PRICE_AGGREGATE
  event_types: [MICRO_002, MARKET]
  micro_size_shares: 0.02
  total_intensity_unit: EVENTS_PER_SECOND
  side_role: CONDITIONAL_MARK
  monetary_mark: SIZE_SHARES_TIMES_NATIVE_EXECUTION_PRICE
  monetary_mark_unit: USDC_PER_ARRIVAL
  notional_throughput_unit: USDC_PER_SECOND
  notional_throughput_is_derived: true
  micro_market_independence: TESTED_NULL_NOT_ASSUMPTION

baseline:
  nesting: [B0_R, B1_P_GIVEN_R_BAND, B2_TICK_TAIL, B3_BOOK, M1_TYPE, M2_SIDE, M3_NOTIONAL_MARK]
  retention_metric: FORWARD_NEGATIVE_LOG_LIKELIHOOD
  retention_rule: DAY_BLOCK_BOOTSTRAP_95_PERCENT_UPPER_DELTA_BELOW_ZERO

hawkes:
  admitted_only_after_full_baseline: true
  minimum_complete_primary_days: 10
  baseline_time_change_required: true
  operational_time_unit: ONE_EXPECTED_BASELINE_ARRIVAL
  multitype_baseline: JOINT_REFIT_TYPE_BASELINES_WITH_MEAN_TOTAL_RATE_ONE
  admission_test_correction: HOLM_ACROSS_COINS_AND_TESTS
  admission_direction: RESIDUAL_CLUSTERING
  # Extended DOWNWARD 2026-08-21: the 0.25 floor was selected by 6 of 7 coins,
  # a CENSORED estimate rather than a selection (~36 ms on btc = order splitting).
  candidate_half_lives_operational: [0.03, 0.0625, 0.125, 0.25, 0.5, 1, 2, 5, 10]
  warmup:
    minimum_calendar_s: 60
    minimum_operational_u: 60
  carry_history_across_adjacent_markets: true
  gap_policy: RESET_AND_WARM_UP
  stationarity:
    univariate_branching_upper: 1.0
    multitype_spectral_radius_upper: 1.0
  retention:
    forward_nll_bootstrap_upper_below_zero: true
    branching_bootstrap_upper_below_one: true
    max_ks_worsening: 0.01
    admitting_cluster_test_must_clear: true

evaluation:
  unit: COMPLETE_UTC_DAY
  schedule: EXPANDING_WINDOW_DAY_HELD_OUT
  require_fit_data_through_before_evaluation_day: true
  bootstrap_unit: UTC_DAY
  minimum_complete_primary_days_per_coin: 10
  multiplicity: HOLM
  diagnostics:
    - EXP1_KS_MAX_CDF_DEVIATION
    - TRANSFORMED_SHORT_GAP_EXCESS_LT_0_25
    - LJUNG_BOX_LAGS_1_TO_10
    - MARK_RANDOMIZED_QUANTILE_RESIDUALS

