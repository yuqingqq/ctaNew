# BE 149 -- drop-in, NOT an edit to the unit file and NOT a pinned module.
#
# WHY. Both pipelines run in research.slice with NO lock. Hourly they exit
# IDLE in ~1 s, but after a day closes the catch-up takes ~12 GB for ~56 min
# (record: the 09-10 catch-up). The slice cap is 15.0 GB and a BE tape/book
# peaks 5.8-7.7 GB, so 12 + 7.7 exceeds the cap: one of them dies and a day
# is rebuilt. The next catch-up fires ~00:21Z on 09-12, when 09-11's tape or
# book will be on the lock.
#
# THE FIX IS TO WAIT, NOT TO SKIP. A BLOCKING flock (no -n) makes the
# pipeline queue behind a build instead of colliding with it, and makes a
# build queue behind the catch-up. Nothing is dropped; the cadence survives
# because --scheduled already makes IDLE a successful exit.
#
# TimeoutStartUSec is ALREADY infinity on both units (read, not assumed), so
# a blocking wait cannot be killed mid-wait and cannot fire OnFailure=.
[Service]
ExecStart=
ExecStart=/usr/bin/flock /home/yuqing/ctaNew/data/.heavy_run.lock /home/yuqing/pricer-sol/venv/bin/python3 -m live.pm_research.measurement_batch --catch-up --since 2026-08-20 --lane measurement --max-days 1 --scheduled --json
