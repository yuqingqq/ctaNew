decisions:
  - {date: 2026-09-28, what: "detection = nowcasting (catch the move early, escalate, flag reversal), NOT prediction",
     why: "prior repo research: free-data predictive edges are thin; the user asked to capture moves in time"}
  - {date: 2026-09-28, what: "same ticker is split into price clusters, never dropped",
     why: "OKX QNT-USDT-SWAP is an equity perp; META = Metadium (KRW) / stock perp / token"}
  - {date: 2026-09-28, what: "thresholds chosen on August 2026 only; budget 12 NEW / 40 msgs per day declared up front",
     why: "CLAUDE.md rule 11; grid 1 failed the budget, pre-declared grid 2 used"}
  - {date: 2026-09-28, what: "per-coin budget limits NEW only; escalations/reversals never capped",
     why: "v2 hid QNT's +33% -> +89% final leg; v3 delayed the blow-off NEW to the top minute"}
  - {date: 2026-09-28, what: "memory: replay at default 4 GiB cap with 2 GiB self-guard; service MemoryHigh 1G / Max 1536M",
     why: "user directive: never break the memory limit, keep a buffer"}
  - {date: 2026-09-28, what: "Telegram via the existing ctaNew/.env credentials; MOVEWATCH_TELEGRAM_* override",
     why: "already configured for this box's other notifiers"}
  - {date: 2026-09-28, what: "forward-test market adjustment = snapshot medians (replay mkt_median), not a live index",
     why: "the daily restart (RuntimeMaxSec) broke a cumulative index at every start: no 72h row could have counted"}
  - {date: 2026-09-28, what: "forward test admits runs by code fingerprint, not by date",
     why: "CLAUDE.md rules 12/16: verify at the artifact; dry runs or edited code must not enter the sample silently"}
  - {date: 2026-09-28, what: "+4h Telegram check only for pumps whose NEW was messaged; dumps and digest-held alerts recorded silently",
     why: "held alerts were never seen individually; a burst day would otherwise send a burst of checks 4h later"}
  - {date: 2026-09-28, what: "TradFi (stocks/ETFs/commodities) excluded from detection, market median and breadth",
     why: "not crypto; the research excluded them too; they leaked live via Bitget RWA perps and tokenized stocks"}
